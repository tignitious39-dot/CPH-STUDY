<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b5cab">
<title>CPH STUDY</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
  min-height:100vh;
}

header{
  background:linear-gradient(135deg,#064b9b,#0b78d0);
  color:white;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.icon{
  font-size:35px;
}

.brand b{
  display:block;
  font-size:20px;
}

.brand small{
  opacity:.9;
}

header button{
  background:rgba(255,255,255,.18);
  color:white;
  border:0;
  font-size:22px;
  padding:10px;
  border-radius:10px;
}

main{
  max-width:900px;
  margin:auto;
  padding:18px 15px 90px;
}

.hero{
  background:linear-gradient(135deg,#0b5cab,#1688df);
  color:white;
  padding:25px;
  border-radius:18px;
  margin-bottom:18px;
}

.hero h1{
  margin-bottom:8px;
}

.quote{
  margin-top:18px;
  background:rgba(255,255,255,.15);
  padding:12px;
  border-radius:10px;
}

.search{
  margin-bottom:20px;
}

.search input{
  width:100%;
  padding:15px;
  border:1px solid #ccd5df;
  border-radius:12px;
  font-size:16px;
}

section{
  margin-bottom:25px;
}

h2{
  margin-bottom:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
}

.card{
  background:white;
  padding:18px;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
  margin-bottom:15px;
}

.level{
  cursor:pointer;
  transition:.2s;
}

.level:hover{
  transform:translateY(-2px);
}

.tools{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.tools button,
.card button{
  border:0;
  background:#0b5cab;
  color:white;
  padding:14px;
  border-radius:10px;
  font-size:15px;
  cursor:pointer;
}

.tools button{
  min-height:90px;
  font-size:28px;
}

.tools button span{
  display:block;
  font-size:14px;
  margin-top:7px;
}

.option{
  width:100%;
  text-align:left;
  margin:8px 0;
  background:#f5f7fa!important;
  color:#172033!important;
  border:1px solid #d5dce5!important;
}

.option.correct{
  border:3px solid #198754!important;
}

.option.wrong{
  border:3px solid #dc3545!important;
}

.explanation{
  margin-top:15px;
  padding:13px;
  background:#eef6ff;
  border-left:4px solid #0b5cab;
  border-radius:7px;
}

textarea{
  width:100%;
  min-height:110px;
  padding:12px;
  border:1px solid #ccd5df;
  border-radius:9px;
  margin:10px 0;
  font-family:inherit;
}

select{
  width:100%;
  padding:13px;
  border:1px solid #ccd5df;
  border-radius:9px;
  margin:12px 0;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #ddd;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:7px;
  z-index:20;
}

nav button{
  border:0;
  background:transparent;
  padding:7px;
  font-size:18px;
  cursor:pointer;
}

nav span{
  display:block;
  font-size:11px;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:#f3f6fa;
  padding:14px;
  text-align:center;
  border-radius:10px;
}

.stat b{
  display:block;
  color:#0b5cab;
  font-size:23px;
}

.hidden{
  display:none;
}

.dark{
  background:#101722;
  color:#f1f5f9;
}

.dark .card,
.dark nav,
.dark .stat{
  background:#1b2635;
  color:#f1f5f9;
}

.dark .search input,
.dark textarea,
.dark select{
  background:#1b2635;
  color:white;
  border-color:#435064;
}

.dark .option{
  background:#263244!important;
  color:white!important;
}

@media(max-width:500px){
  .tools{
    grid-template-columns:1fr 1fr;
  }

  .stat-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>

<div class="brand">
  <div class="icon">✚</div>
  <div>
    <b>CPH STUDY</b>
    <small>Learn • Practice • Master</small>
  </div>
</div>

<button onclick="enableNotifications()">🔔</button>

</header>


<main>

<section class="hero">

<h1>Welcome to CPH STUDY</h1>

<p>
Your medical and pharmacy learning resource.
</p>

<div class="quote" id="quote"></div>

</section>


<div class="search">

<input
id="search"
type="search"
placeholder="🔎 Search courses, topics and materials..."
oninput="searchApp()"
>

</div>


<section>

<h2>📚 CPH Levels</h2>

<div class="grid">

<div class="card level"
onclick="openLevel('CPH 1.1')">
<h3>CPH 1.1</h3>
<p>Foundation studies</p>
</div>

<div class="card level"
onclick="openLevel('CPH 1.2')">
<h3>CPH 1.2</h3>
<p>Core pharmacy studies</p>
</div>

<div class="card level"
onclick="openLevel('CPH 2.1')">
<h3>CPH 2.1</h3>
<p>Advanced studies</p>
</div>

<div class="card level"
onclick="openLevel('CPH 2.2')">
<h3>CPH 2.2</h3>
<p>Advanced revision</p>
</div>

</div>

</section>


<section>

<h2>🛠️ Study Tools</h2>

<div class="tools">

<button onclick="openQuiz()">
📝
<span>Quizzes</span>
</button>

<button onclick="openCalculations()">
🧮
<span>Calculations</span>
</button>

<button onclick="openDiscussions()">
💬
<span>Discussions</span>
</button>

<button onclick="openProgress()">
📊
<span>Progress</span>
</button>

</div>

</section>


<div id="content"></div>


</main>


<nav>

<button onclick="goHome()">
🏠
<span>Home</span>
</button>

<button onclick="focusSearch()">
🔎
<span>Search</span>
</button>

<button onclick="openSaved()">
🔖
<span>Saved</span>
</button>

<button onclick="openSettings()">
⚙️
<span>Settings</span>
</button>

</nav>


<script>

/* ==========================================
   CPH STUDY SINGLE-FILE APP
========================================== */

const content =
document.getElementById("content");


/* DAILY QUOTE */

const quotes=[
"Small progress every day becomes great achievement.",
"Study the concept, not only the answer.",
"Consistency beats last-minute preparation.",
"Every question is an opportunity to learn.",
"Learn • Practice • Master.",
"Your effort today builds your knowledge tomorrow."
];

const day=
Math.floor(Date.now()/86400000);

document.getElementById("quote").textContent=
"💡 "+quotes[day%quotes.length];


/* ==========================================
   HOME
========================================== */

function goHome(){

content.innerHTML="";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* ==========================================
   LEVELS
========================================== */

function openLevel(level){

content.innerHTML=`

<div class="card">

<h2>📚 ${level}</h2>

<p>
Select a learning activity for ${level}.
</p>

<br>

<button onclick="openQuiz()">
📝 Practice Questions
</button>

<button onclick="openCalculations()">
🧮 Pharmaceutical Calculations
</button>

</div>
`;

content.scrollIntoView({
behavior:"smooth"
});

}


/* ==========================================
   QUIZ DATABASE
========================================== */

const questions=[

{
q:"What is pharmacology?",
options:[
"The study of drugs and their effects",
"The study of bones",
"The study of food",
"The study of microorganisms only"
],
answer:0,
explanation:
"Pharmacology is the study of drugs and their effects on living systems."
},

{
q:"What does pharmacokinetics describe?",
options:[
"What the drug does to the body",
"What the body does to the drug",
"Only adverse drug reactions",
"Only drug manufacturing"
],
answer:1,
explanation:
"Pharmacokinetics describes what the body does to a drug, including absorption, distribution, metabolism and excretion."
},

{
q:"Which formula is commonly used for dilution calculations?",
options:[
"C₁V₁ = C₂V₂",
"E = mc²",
"F = ma",
"P = IV"
],
answer:0,
explanation:
"C₁V₁ = C₂V₂ is commonly used for dilution calculations."
},

{
q:"A medicine contains 500 mg in 5 mL. How many mg are in 1 mL?",
options:[
"50 mg",
"100 mg",
"250 mg",
"500 mg"
],
answer:1,
explanation:
"500 mg ÷ 5 mL = 100 mg/mL."
},

{
q:"Which organ pumps blood around the body?",
options:[
"Liver",
"Heart",
"Kidney",
"Lung"
],
answer:1,
explanation:
"The heart pumps blood through the cardiovascular system."
},

{
q:"What is homeostasis?",
options:[
"Complete absence of change",
"Maintenance of a relatively stable internal environment",
"Digestion of food",
"Movement of bones"
],
answer:1,
explanation:
"Homeostasis is the maintenance of relatively stable internal conditions."
},

{
q:"Microbiology is primarily the study of:",
options:[
"Microorganisms",
"Bones",
"Medicines only",
"Macroscopic plants only"
],
answer:0,
explanation:
"Microbiology studies microorganisms such as bacteria, viruses and fungi."
},

{
q:"Which is a pharmaceutical dosage form?",
options:[
"Tablet",
"Neuron",
"Artery",
"Enzyme"
],
answer:0,
explanation:
"A tablet is a solid pharmaceutical dosage form."
}

];


let quizQuestions=[];
let quizPosition=0;
let quizScore=0;
let quizLocked=false;


/* ==========================================
   QUIZ
========================================== */

function openQuiz(){

content.innerHTML=`

<div class="card">

<h2>📝 CPH STUDY Quiz Centre</h2>

<p>
Test your knowledge with interactive revision questions.
</p>

<select id="quizAmount">

<option value="5">5 Questions</option>
<option value="8">8 Questions</option>

</select>

<button onclick="startQuiz()">
🚀 Start Quiz
</button>

</div>
`;

content.scrollIntoView({
behavior:"smooth"
});

}


function startQuiz(){

const amount=
Number(
document.getElementById("quizAmount").value
);

quizQuestions=
[...questions]
.sort(()=>Math.random()-.5)
.slice(0,amount);

quizPosition=0;
quizScore=0;

showQuestion();

}


function showQuestion(){

const q=
quizQuestions[quizPosition];

quizLocked=false;

content.innerHTML=`

<div class="card">

<h2>📝 Quiz</h2>

<p>
Question ${quizPosition+1}
of ${quizQuestions.length}
</p>

<hr style="margin:12px 0">

<h3>
${q.q}
</h3>

<div>

${q.options.map(
(option,i)=>`

<button
class="option"
id="option${i}"
onclick="answerQuestion(${i})">

${String.fromCharCode(65+i)}.
${option}

</button>

`).join("")}

</div>

<div
id="explanation"
class="explanation hidden">
</div>

<button
id="nextButton"
class="hidden"
onclick="nextQuestion()">

Next Question →

</button>

</div>
`;

content.scrollIntoView({
behavior:"smooth"
});

}


function answerQuestion(selected){

if(quizLocked)return;

quizLocked=true;

const q=
quizQuestions[quizPosition];

const buttons=
document.querySelectorAll(".option");

buttons.forEach(
(button,index)=>{

button.disabled=true;

if(index===q.answer){
button.classList.add("correct");
}

});

if(selected!==q.answer){

document
.getElementById("option"+selected)
.classList.add("wrong");

}else{

quizScore++;

}

const explanation=
document.getElementById("explanation");

explanation.textContent=
"Explanation: "+q.explanation;

explanation.classList.remove("hidden");

document
.getElementById("nextButton")
.classList.remove("hidden");

}


function nextQuestion(){

quizPosition++;

if(
quizPosition>=quizQuestions.length
){

finishQuiz();

}else{

showQuestion();

}

}


function finishQuiz(){

const total=
quizQuestions.length;

const percentage=
Math.round(
quizScore/total*100
);


/* SAVE RESULT */

const history=
JSON.parse(
localStorage.getItem("cphHistory")
||"[]"
);

history.push({

date:new Date().toLocaleString(),

score:quizScore,

total:total,

percentage:percentage

});

localStorage.setItem(
"cphHistory",
JSON.stringify(history)
);


let message=
"Keep practicing!";

if(percentage>=80)
message="🌟 Excellent performance!";

else if(percentage>=60)
message="👍 Good work! Review the questions you missed.";

content.innerHTML=`

<div class="card" style="text-align:center">

<h2>🎉 Quiz Complete</h2>

<div style="
font-size:48px;
font-weight:bold;
color:#0b5cab;
margin:15px">
${percentage}%
</div>

<p>
You scored
<b>${quizScore}</b>
out of
<b>${total}</b>.
</p>

<br>

<h3>${message}</h3>

<br>

<button onclick="openQuiz()">
📝 Try Again
</button>

<button onclick="openProgress()">
📊 View Progress
</button>

</div>
`;

}


/* ==========================================
   CALCULATIONS
========================================== */

function openCalculations(){

content.innerHTML=`

<div class="card">

<h2>🧮 Pharmaceutical Calculations</h2>

<h3>💧 Dilution</h3>

<p>
C₁V₁ = C₂V₂
</p>

<br>

<h3>💊 Dose Calculation</h3>

<p>
Volume required =
Dose required ÷ Dose available
× Volume containing available dose.
</p>

<br>

<h3>➗ Allegation</h3>

<p>
Allegation is a method used to determine the
proportions of two preparations of different
strengths required to produce a desired
intermediate strength.
</p>

<br>

<button onclick="calculationPractice()">
📝 Practice
</button>

</div>
`;

content.scrollIntoView({
behavior:"smooth"
});

}


function calculationPractice(){

content.innerHTML=`

<div class="card">

<h2>🧮 Calculation Practice</h2>

<p>
A preparation contains 500 mg in 5 mL.
How many milligrams are contained in 2 mL?
</p>

<input
id="calc"
type="number"
placeholder="Enter answer in mg"
style="
width:100%;
padding:13px;
margin:15px 0;
border:1px solid #ccd5df;
border-radius:8px;
">

<button onclick="checkCalculation()">
Check Answer
</button>

<div id="calcResult"
style="margin-top:15px">
</div>

</div>
`;

}


function checkCalculation(){

const answer=
Number(
document.getElementById("calc").value
);

const result=
document.getElementById("calcResult");

if(answer===200){

result.innerHTML=
"✅ Correct! 500 ÷ 5 = 100 mg/mL. Therefore 100 × 2 = 200 mg.";

}else{

result.innerHTML=
"❌ Not correct. Calculate 500 mg ÷ 5 mL first, then multiply by 2 mL.";

}

}


/* ==========================================
   DISCUSSIONS
========================================== */

function openDiscussions(){

content.innerHTML=`

<div class="card">

<h2>💬 Discussions</h2>

<p>
Ask an academic question or share a useful explanation.
</p>

<textarea
id="postText"
placeholder="Write your question..."
></textarea>

<button onclick="addPost()">
📤 Post
</button>

<div
id="posts"
style="margin-top:20px">
</div>

</div>
`;

loadPosts();

}


function addPost(){

const input=
document.getElementById("postText");

const text=
input.value.trim();

if(!text){

alert("Write something first.");

return;

}

const posts=
JSON.parse(
localStorage.getItem("cphPosts")
||"[]"
);

posts.push({

text:text,

date:new Date().toLocaleString()

});

localStorage.setItem(
"cphPosts",
JSON.stringify(posts)
);

input.value="";

loadPosts();

}


function loadPosts(){

const container=
document.getElementById("posts");

if(!container)return;

const posts=
JSON.parse(
localStorage.getItem("cphPosts")
||"[]"
);

if(!posts.length){

container.innerHTML=
"<p>No discussions yet.</p>";

return;

}

container.innerHTML=
posts.slice().reverse().map(
post=>`

<div class="card">

<p>${safe(post.text)}</p>

<small>${post.date}</small>

</div>

`
).join("");

}


/* ==========================================
   PROGRESS
========================================== */

function openProgress(){

const history=
JSON.parse(
localStorage.getItem("cphHistory")
||"[]"
);

if(!history.length){

content.innerHTML=`

<div class="card">

<h2>📊 Progress</h2>

<p>
No quiz attempts yet.
</p>

<br>

<button onclick="openQuiz()">
📝 Take Your First Quiz
</button>

</div>
`;

return;

}

const latest=
history[history.length-1];

const average=
Math.round(
history.reduce(
(sum,item)=>sum+item.percentage,
0
)/history.length
);

const totalCorrect=
history.reduce(
(sum,item)=>sum+item.score,
0
);

content.innerHTML=`

<div class="card">

<h2>📊 My Progress</h2>

<div class="stat-grid">

<div class="stat">
<b>${latest.percentage}%</b>
Latest
</div>

<div class="stat">
<b>${average}%</b>
Average
</div>

<div class="stat">
<b>${history.length}</b>
Quizzes
</div>

</div>

<br>

<h3>Recent Attempts</h3>

${history.slice(-5).reverse().map(
item=>`

<div style="
padding:12px 0;
border-bottom:1px solid #ddd">

<b>${item.percentage}%</b>

—
${item.score}/${item.total}
correct

<br>

<small>${item.date}</small>

</div>

`
).join("")}

<br>

<button onclick="openQuiz()">
📝 Take Quiz
</button>

<button onclick="clearProgress()">
🗑️ Clear
</button>

</div>
`;

}


function clearProgress(){

if(
confirm("Clear all saved quiz progress?")
){

localStorage.removeItem(
"cphHistory"
);

openProgress();

}

}


/* ==========================================
   SEARCH
========================================== */

function focusSearch(){

document
.getElementById("search")
.focus();

}


function searchApp(){

const query=
document
.getElementById("search")
.value
.toLowerCase()
.trim();

if(!query){

content.innerHTML="";

return;

}

const topics=[

"Pharmacology",
"Pharmaceutics",
"Pharmaceutical Calculations",
"Dilution",
"Allegation",
"Dosage Calculations",
"Anatomy & Physiology",
"Microbiology",
"Biochemistry",
"Clinical Pharmacy",
"CPH Revision",
"Quizzes"

];

const matches=
topics.filter(
topic=>
topic.toLowerCase().includes(query)
);

content.innerHTML=`

<div class="card">

<h2>🔎 Search Results</h2>

${
matches.length
?
matches.map(
topic=>`

<button
onclick="searchTopic('${topic}')"
style="
display:block;
width:100%;
margin:8px 0;
text-align:left">

📚 ${topic}

</button>

`
).join("")
:
"<p>No matching topic found.</p>"
}

</div>
`;

}


function searchTopic(topic){

if(topic==="Quizzes"){

openQuiz();

return;

}

content.innerHTML=`

<div class="card">

<h2>📚 ${topic}</h2>

<p>
Study materials for <b>${topic}</b>
will appear in this section.
</p>

<br>

<button onclick="openQuiz()">
📝 Test Yourself
</button>

</div>
`;

}


/* ==========================================
   SAVED
========================================== */

function openSaved(){

content.innerHTML=`

<div class="card">

<h2>🔖 Saved Materials</h2>

<p>
Your saved learning resources will appear here.
</p>

<br>

<button onclick="saveExample()">
🔖 Save Pharmaceutical Calculations
</button>

<div id="savedItems"
style="margin-top:15px">
</div>

</div>
`;

loadSaved();

}


function saveExample(){

localStorage.setItem(
"cphSaved",
"Pharmaceutical Calculations"
);

loadSaved();

}


function loadSaved(){

const box=
document.getElementById("savedItems");

if(!box)return;

const saved=
localStorage.getItem("cphSaved");

box.innerHTML=
saved
?
`🔖 ${saved}`
:
"No saved materials yet.";

}


/* ==========================================
   SETTINGS
========================================== */

function openSettings(){

content.innerHTML=`

<div class="card">

<h2>⚙️ Settings</h2>

<button onclick="toggleDark()">
🌙 Toggle Dark Mode
</button>

<br><br>

<button onclick="enableNotifications()">
🔔 Notifications
</button>

<br><br>

<button onclick="clearAppData()">
🗑️ Clear App Data
</button>

</div>
`;

}


function toggleDark(){

document.body.classList.toggle("dark");

localStorage.setItem(
"cphDark",
document.body.classList.contains("dark")
);

}


if(
localStorage.getItem("cphDark")==="true"
){

document.body.classList.add("dark");

}


/* ==========================================
   NOTIFICATIONS
========================================== */

function enableNotifications(){

if(!("Notification" in window)){

alert(
"Notifications are not supported by this browser."
);

return;

}

Notification.requestPermission()
.then(
permission=>{

if(permission==="granted"){

alert(
"🔔 Notifications have been enabled."
);

}else{

alert(
"Notification permission was not granted."
);

}

});

}


/* ==========================================
   CLEAR DATA
========================================== */

function clearAppData(){

if(
confirm(
"Clear saved quiz progress, discussions and bookmarks?"
)
){

localStorage.clear();

location.reload();

}

}


/* ==========================================
   SECURITY
========================================== */

function safe(text){

const div=
document.createElement("div");

div.textContent=text;

return div.innerHTML;

}

</script>

</body>
  </html>
