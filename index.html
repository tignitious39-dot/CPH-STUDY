function home(){

function openClass(level){

`;

html+=`

<h3>📖 ${unit}</h3>

<div class="unit-buttons">

<button onclick="notes('${level}','${unit}')">
📖 Notes
</button>

<button onclick="quiz('${level}','${unit}')">
📝 Quiz
</button>

<button onclick="discussion('${level}','${unit}')">
💬 Discussion
</button>

<button class="secondary"
onclick="saveUnit('${level}','${unit}')">
🔖 Save
</button>

</div>
</div>
`;
});

html+=`</div>`;

document.getElementById("content").innerHTML=html;
}

let active=[];
let currentQuestion=0;
let currentScore=0;


/* ================================
   QUIZ
================================ */

function quiz(level,unit){

let key=level+"|"+unit;
active=questionBank[key]||[];

if(active.length===0){

document.getElementById("content").innerHTML=`
<div class="card">
<button class="secondary"
onclick="openClass('${level}')">← Back</button>
<h2>📝 ${unit}</h2>
<p>
The question bank for this unit is being prepared.
</p>
<p>
No questions from another class will be mixed into this quiz.
</p>
</div>
`;
return;
}

currentQuestion=0;
currentScore=0;
showQuestion(level,unit);
}


function showQuestion(level,unit){

let q=active[currentQuestion];

document.getElementById("content").innerHTML=`
<div class="card">

<button class="secondary"
onclick="openClass('${level}')">
← Back
</button>

<h2>📝 ${unit}</h2>
<p>${level} • Question ${currentQuestion+1}/${active.length}</p>

<hr>

<h3>${q[0]}</h3>

${q[1].map((answer,i)=>`
<button class="answer"
onclick="answerQuestion(${i},${q[2]},'${level}','${unit}')">
${String.fromCharCode(65+i)}. ${answer}
</button>
`).join("")}

<div id="explanation"></div>

</div>
`;
}


function answerQuestion(selected,correct,level,unit){

let buttons=document.querySelectorAll(".answer");

buttons.forEach(b=>b.disabled=true);

if(selected===correct){
currentScore++;
buttons[selected].classList.add("correct");
}else{
buttons[selected].classList.add("wrong");
buttons[correct].classList.add("correct");
}

let q=active[currentQuestion];

document.getElementById("explanation").innerHTML=`
<div class="post">
<b>Explanation</b>
<p>${q[3]}</p>
<button onclick="nextQuestion('${level}','${unit}')">
Next →
</button>
</div>
`;
}


function nextQuestion(level,unit){

currentQuestion++;

if(currentQuestion>=active.length){

let percentage=
Math.round(currentScore/active.length*100);

let history=
JSON.parse(localStorage.getItem("cphProgress")||"[]");

history.push({
level,
unit,
score:currentScore,
total:active.length,
percentage,
date:new Date().toLocaleString()
});

localStorage.setItem("cphProgress",JSON.stringify(history));

document.getElementById("content").innerHTML=`
<div class="card">
<h2>🎉 Quiz Complete</h2>
<h3>${level}</h3>
<p>${unit}</p>
<h1>${percentage}%</h1>
<p>Score: ${currentScore}/${active.length}</p>

<button onclick="quiz('${level}','${unit}')">
Retry
</button>

<button onclick="openClass('${level}')">
Back to Class
</button>
</div>
`;

return;
}

showQuestion(level,unit);
}

function discussionUnits(level){

let html=`
<div class="card">
<button class="secondary" onclick="discussionClasses()">
← Classes
</button>
<h2>💬 ${level} Discussions</h2>
</div>
<div class="grid">
`;

curriculum[level].forEach(unit=>{
html+=`
<div class="card">
<h3>📖 ${unit}</h3>
<button onclick="discussion('${level}','${unit}')">
Open Discussion
</button>
</div>
`;
});

html+=`</div>`;

document.getElementById("content").innerHTML=html;
}


function discussion(level,unit){

let key="discussion_"+level+"_"+unit;

let posts=
JSON.parse(localStorage.getItem(key)||"[]");

document.getElementById("content").innerHTML=`

<div class="card">

<button class="secondary"
onclick="openClass('${level}')">
← Back
</button>

<h2>💬 ${unit}</h2>

<p><b>${level}</b> discussion room</p>

<textarea id="message"
placeholder="Ask a question or share something useful..."></textarea><button onclick="postDiscussion('${level}','${unit}')">
📤 Post
</button></div><div class="card"><h3>Discussion Posts</h3>${
posts.length
?
posts.map(p=>`

<div class="post">
${escapeHTML(p.text)}
<br>
<small>${p.time}</small>
</div>
`).join("")
:
"<p>No posts yet. Start the discussion.</p>"
}</div>
`;
}function postDiscussion(level,unit){

let box=document.getElementById("message");
let text=box.value.trim();

if(!text){
alert("Write a message first.");
return;
}

let key="discussion_"+level+"_"+unit;

let posts=
JSON.parse(localStorage.getItem(key)||"[]");

posts.push({
text,
time:new Date().toLocaleString()
});

localStorage.setItem(key,JSON.stringify(posts));

discussion(level,unit);
}

SAVED

function saveUnit(level,unit){

let data=
JSON.parse(localStorage.getItem("cphSaved")||"[]");

if(!data.some(x=>x.level===level&&x.unit===unit)){
data.push({level,unit});
localStorage.setItem("cphSaved",JSON.stringify(data));
}

alert("🔖 Saved.");
}

function saved(){

let data=
JSON.parse(localStorage.getItem("cphSaved")||"[]");

document.getElementById("content").innerHTML=`

<div class="card">
<h2>🔖 Saved Materials</h2>${
data.length
?
data.map(x=>`

<div class="post">
<b>${x.level}</b><br>
${x.unit}<br>
<button onclick="notes('${x.level}','${x.unit}')">
Open Notes
</button>
</div>
`).join("")
:
"<p>No saved materials yet.</p>"
}</div>
`;
