<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0757a0">
<title>CPH STUDY</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f7fb;
 color:#172033;
}
header{
 background:#0757a0;
 color:white;
 padding:16px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 position:sticky;
 top:0;
 z-index:5;
}
.brand{display:flex;gap:10px;align-items:center}
.icon{font-size:30px}
.title{font-size:20px;font-weight:bold}
.small{font-size:12px;opacity:.9}
main{max-width:950px;margin:auto;padding:16px 14px 90px}
.hero{
 background:linear-gradient(135deg,#0757a0,#168ee5);
 color:white;
 padding:22px;
 border-radius:16px;
 margin-bottom:18px;
}
.hero h1{margin:0 0 5px}
.quote{
 margin-top:15px;
 padding:12px;
 background:rgba(255,255,255,.15);
 border-radius:9px;
}
.search input{
 width:100%;
 padding:14px;
 border:1px solid #ccd5df;
 border-radius:10px;
 font-size:16px;
 margin-bottom:18px;
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:12px;
}
.card{
 background:white;
 padding:17px;
 border-radius:13px;
 box-shadow:0 3px 12px rgba(0,0,0,.07);
 margin-bottom:12px;
}
button{
 border:0;
 border-radius:9px;
 padding:11px 14px;
 margin:4px;
 background:#0757a0;
 color:white;
 cursor:pointer;
}
.secondary{
 background:#eaf1f8;
 color:#0757a0;
}
.tool{
 width:100%;
 min-height:85px;
 font-size:24px;
}
.tool span{
 display:block;
 font-size:14px;
 margin-top:5px;
}
.unit-buttons{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
}
.unit-buttons button{margin:0}
textarea,input[type=text]{
 width:100%;
 padding:12px;
 border:1px solid #ccd5df;
 border-radius:9px;
 font:inherit;
}
textarea{min-height:110px}
.post{
 background:#f5f8fb;
 padding:12px;
 border-left:4px solid #168ee5;
 border-radius:8px;
 margin-top:10px;
}
.answer{
 display:block;
 width:100%;
 text-align:left;
 background:#f0f4f8;
 color:#172033;
}
.correct{border:3px solid #198754}
.wrong{border:3px solid #dc3545}
.hidden{display:none}
nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:white;
 border-top:1px solid #ddd;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 z-index:10;
}
nav button{
 background:white;
 color:#172033;
 margin:0;
 border-radius:0;
}
nav span{display:block;font-size:11px}

@media(max-width:600px){
 .unit-buttons{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
 <div class="brand">
  <div class="icon">✚</div>
  <div>
   <div class="title">CPH STUDY</div>
   <div class="small">Learn • Practice • Master</div>
  </div>
 </div>
 <button onclick="notifyUser()">🔔</button>
</header>

<main>

<section class="hero">
 <h1>Welcome to CPH STUDY</h1>
 <p>Certificate in Pharmacy Study Platform</p>
 <div class="quote" id="quote"></div>
</section>

<div class="search">
 <input
  id="search"
  type="text"
  placeholder="🔎 Search classes and course units..."
  oninput="searchCourses()">
</div>

<div id="content"></div>

</main>

<nav>
 <button onclick="home()">🏠<span>Home</span></button>
 <button onclick="focusSearch()">🔎<span>Search</span></button>
 <button onclick="saved()">🔖<span>Saved</span></button>
 <button onclick="settings()">⚙️<span>Settings</span></button>
</nav>

<script>

/* =========================
   CURRICULUM
========================= */

const curriculum={
 "CPH 1.1":[
  "Microbiology",
  "Anatomy & Physiology 1",
  "Pharmaceutical Chemistry 1",
  "First Aid",
  "PHC",
  "Computer Applications"
 ],

 "CPH 1.2":[
  "Anatomy & Physiology 2",
  "Pharmaceutical Chemistry 2",
  "Pharmaceutical Calculations",
  "Pharmacognosy",
  "Pharmacology 1",
  "Medical Psychology",
  "Communication Skills",
  "Pharmaceutical Practicals"
 ],

 "CPH 2.1":[
  "Pharmaceutics 1",
  "Pharmacy Laws & Regulations",
  "Pharmacy Practice 1",
  "Therapeutics 1",
  "Pharmacology 2",
  "Stores & Inventory Management"
 ],

 "CPH 2.2":[
  "Pharmaceutics 2",
  "Quality Assurance of Pharmaceuticals",
  "Pharmacy Practice 2",
  "Therapeutics 2",
  "Entrepreneurship"
 ]
};


/* =========================
   MOTIVATION
========================= */

const quotes=[
 "📚 Study consistently, not occasionally.",
 "🧠 Understand first. Memorize second.",
 "🎯 Every topic mastered is one step forward.",
 "💊 Good pharmacy practice begins with good knowledge.",
 "🔬 Learn the science behind the medicine.",
 "📖 Read. Recall. Practise. Improve.",
 "🏆 Your effort today builds your professional future.",
 "💡 Ask questions whenever a concept is unclear."
];

function updateQuote(){
 const hour=new Date().getHours();
 document.getElementById("quote").textContent=
 quotes[hour%quotes.length];
}

updateQuote();
setInterval(updateQuote,60000);


/* =========================
   HOME
========================= */

function home(){

 document.getElementById("search").value="";

 document.getElementById("content").innerHTML=`

 <h2>🎓 Select Your Class</h2>

 <div class="grid">

 ${Object.keys(curriculum).map(level=>`

  <div class="card">

   <h3>📚 ${level}</h3>

   <p>
    ${curriculum[level].length} course units
   </p>

   <button onclick="openClass('${level}')">
    Open Class
   </button>

  </div>

 `).join("")}

 </div>

 <h2>🛠️ Study Tools</h2>

 <div class="grid">

  <button class="tool" onclick="quizClasses()">
   📝
   <span>Quizzes</span>
  </button>

  <button class="tool" onclick="discussionClasses()">
   💬
   <span>Live Discussions</span>
  </button>

  <button class="tool" onclick="progress()">
   📊
   <span>Progress</span>
  </button>

  <button class="tool" onclick="saved()">
   🔖
   <span>Saved</span>
  </button>

 </div>
 `;
}

home();


/* =========================
   CLASS
========================= */

function openClass(level){

 document.getElementById("content").innerHTML=`

 <div class="card">

  <button class="secondary" onclick="home()">← Home</button>

  <h2>📚 ${level}</h2>

  <p>
   Choose a course unit. Your notes, quizzes and
   discussions remain separated by class and unit.
  </p>

 </div>

 <div class="grid">

 ${curriculum[level].map(unit=>`

  <div class="card">

   <h3>📖 ${unit}</h3>

   <div class="unit-buttons">

    <button onclick="notes('${level}','${unit}')">
     📖 Notes
    </button>

    <button onclick="quiz('${level}','${unit}')">
     📝 Quiz
    </button>

    <button onclick="discussion('${level}','${unit}')">
     💬 Discussion
    </button>

    <button class="secondary"
     onclick="save('${level}','${unit}')">
     🔖 Save
    </button>

   </div>

  </div>

 `).join("")}

 </div>
 `;
}


/* =========================
   NOTES
========================= */

function notes(level,unit){

 document.getElementById("content").innerHTML=`

 <div class="card">

 <button class="secondary"
 onclick="openClass('${level}')">
 ← ${level}
 </button>

 <h2>📖 ${unit}</h2>

 <p><b>${level} → ${unit}</b></p>

 <hr>

 <h3>Study Notes</h3>

 <div class="card">

 <h3>Introduction</h3>

 <p>
 This section contains the structured study material
 for <b>${unit}</b> under <b>${level}</b>.
 </p>

 <h3>Learning objectives</h3>

 <ul>
  <li>Understand the major concepts.</li>
  <li>Learn important terminology.</li>
  <li>Relate theory to pharmacy practice.</li>
  <li>Practise examination questions.</li>
 </ul>

 <h3>Key revision points</h3>

 <p>
 Important definitions, classifications, principles,
 mechanisms and practical applications for this unit
 will be organized here.
 </p>

 </div>

 <button onclick="quiz('${level}','${unit}')">
 📝 Test Yourself
 </button>

 <button onclick="discussion('${level}','${unit}')">
 💬 Discuss This Unit
 </button>

 </div>
 `;
}


/* =========================
   QUIZ BANK
========================= */

const questions={

 "CPH 1.1|Microbiology":[
  {
   q:"What is microbiology?",
   a:[
    "Study of microorganisms",
    "Study of bones",
    "Study of accounting",
    "Study of buildings"
   ],
   correct:0,
   explanation:
   "Microbiology is the scientific study of microorganisms."
  }
 ],

 "CPH 1.1|Anatomy & Physiology 1":[
  {
   q:"Anatomy primarily deals with:",
   a:[
    "Body structure",
    "Drug pricing",
    "Business",
    "Communication"
   ],
   correct:0,
   explanation:
   "Anatomy concerns the structure of the body."
  }
 ],

 "CPH 1.2|Pharmaceutical Calculations":[
  {
   q:"Which equation is commonly used for dilution calculations?",
   a:[
    "C₁V₁ = C₂V₂",
    "E = mc²",
    "F = ma",
    "P = IV"
   ],
   correct:0,
   explanation:
   "C₁V₁ = C₂V₂ is a standard dilution relationship."
  },

  {
   q:"A solution contains 500 mg in 5 mL. How many mg are in 1 mL?",
   a:[
    "50 mg",
    "100 mg",
    "250 mg",
    "500 mg"
   ],
   correct:1,
   explanation:
   "500 mg ÷ 5 mL = 100 mg/mL."
  }
 ],

 "CPH 1.2|Pharmacology 1":[
  {
   q:"Pharmacology is primarily concerned with:",
   a:[
    "Drugs and their effects",
    "Buildings",
    "Accounting",
    "Food preparation"
   ],
   correct:0,
   explanation:
   "Pharmacology studies drugs and their effects on living systems."
  }
 ],

 "CPH 2.1|Pharmacology 2":[
  {
   q:"Pharmacodynamics primarily describes:",
   a:[
    "What a drug does to the body",
    "What the body does to a drug",
    "Drug packaging",
    "Drug purchasing"
   ],
   correct:0,
   explanation:
   "Pharmacodynamics concerns drug effects and mechanisms of action."
  }
 ],

 "CPH 2.2|Entrepreneurship":[
  {
   q:"Entrepreneurship involves:",
   a:[
    "Identifying opportunities and creating value",
    "Only memorizing medicines",
    "Only measuring temperature",
    "Only dispensing tablets"
   ],
   correct:0,
   explanation:
   "Entrepreneurship involves identifying opportunities and organizing resources to create value."
  }
 ]

};


/* =========================
   QUIZ
========================= */

let activeQuestions=[];
let qIndex=0;
let score=0;

function quiz(level,unit){

 const key=level+"|"+unit;

 activeQuestions=questions[key]||[];

 if(activeQuestions.length===0){

  document.getElementById("content").innerHTML=`

  <div class="card">

   <button class="secondary"
   onclick="openClass('${level}')">
   ← Back
   </button>

   <h2>📝 ${unit}</h2>

   <p>
    The question bank for this unit is being prepared.
   </p>

   <p>
    CPH STUDY will never mix questions from another
    class or course unit into this quiz.
   </p>

  </div>`;

  return;
 }

 qIndex=0;
 score=0;

 showQuestion(level,unit);
}


function showQuestion(level,unit){

 const q=activeQuestions[qIndex];

 document.getElementById("content").innerHTML=`

 <div class="card">

 <button class="secondary"
 onclick="openClass('${level}')">
 ← Back
 </button>

 <h2>📝 ${unit}</h2>

 <p>${level} • Question ${qIndex+1}/${activeQuestions.length}</p>

 <hr>

 <h3>${q.q}</h3>

 <div>

 ${q.a.map((answer,i)=>`

  <button
   class="answer"
   onclick="checkAnswer(${i},${q.correct},'${level}','${unit}')">

   ${String.fromCharCode(65+i)}. ${answer}

  </button>

 `).join("")}

 </div>

 <div id="explanation"></div>

 </div>
 `;
}


function checkAnswer(selected,correct,level,unit){

 const buttons=document.querySelectorAll(".answer");

 buttons.forEach(b=>b.disabled=true);

 if(selected===correct){
  score++;
  buttons[selected].classList.add("correct");
 }else{
  buttons[selected].classList.add("wrong");
  buttons[correct].classList.add("correct");
 }

 const q=activeQuestions[qIndex];

 document.getElementById("explanation").innerHTML=`

 <div class="post">

 <b>Explanation</b>

 <p>${q.explanation}</p>

 <button onclick="nextQuestion('${level}','${unit}')">
 Next →
 </button>

 </div>
 `;
}


function nextQuestion(level,unit){

 qIndex++;

 if(qIndex>=activeQuestions.length){

  const percent=
   Math.round(score/activeQuestions.length*100);

  document.getElementById("content").innerHTML=`

  <div class="card">

   <h2>🎉 Quiz Complete</h2>

   <p>${level}</p>

   <p>${unit}</p>

   <h1>${percent}%</h1>

   <p>
    Score: ${score}/${activeQuestions.length}
   </p>

   <button onclick="quiz('${level}','${unit}')">
    Retry
   </button>

   <button onclick="openClass('${level}')">
    Back to Class
   </button>

  </div>
  `;

  return;
 }

 showQuestion(level,unit);
}


/* =========================
   QUIZ CLASS SELECTOR
========================= */

function quizClasses(){

 document.getElementById("content").innerHTML=`

 <div class="card">

 <h2>📝 Choose Class</h2>

 <p>
 Select your class before selecting a quiz.
 </p>

 </div>

 <div class="grid">

 ${Object.keys(curriculum).map(level=>`

  <div class="card">

   <h3>${level}</h3>

   <button onclick="quizUnits('${level}')">
    Choose Unit
   </button>

  </div>

 `).join("")}

 </div>
 `;
}


function quizUnits(level){

 document.getElementById("content").innerHTML=`

 <div class="card">

 <button class="secondary"
 onclick="quizClasses()">
 ← Classes
 </button>

 <h2>📝 ${level} Quizzes</h2>

 </div>

 <div class="grid">

 ${curriculum[level].map(unit=>`

  <div class="card">

   <h3>${unit}</h3>

   <button onclick="quiz('${level}','${unit}')">
    Start Quiz
   </button>

  </div>

 `).join("")}

 </div>
 `;
}


/* =========================
   DISCUSSIONS
========================= */

function discussionClasses(){

 document.getElementById("content").innerHTML=`

 <div class="card">

 <h2>💬 Discussions</h2>

 <p>
 Select your class.
 </p>

 </div>

 <div class="grid">

 ${Object.keys(curriculum).map(level=>`

  <div class="card">

   <h3>${level}</h3>

   <button onclick="discussionUnits('${level}')">
    Course Units
   </button>

  </div>

 `).join("")}

 </div>
 `;
}


function discussionUnits(level){

 document.getElementById("content").innerHTML=`

 <div class="card">

 <button class="secondary"
 onclick="discussionClasses()">
 ← Classes
 </button>

 <h2>💬 ${level}</h2>

 </div>

 <div class="grid">

 ${curriculum[level].map(unit=>`

  <div class="card">

   <h3>${unit}</h3>

   <button onclick="discussion('${level}','${unit}')">
    💬 Open Discussion
   </button>

  </div>

 `).join("")}

 </div>
 `;
}


function discussion(level,unit){

 const key="cphDiscussion_"+level+"_"+unit;

 const posts=
 JSON.parse(localStorage.getItem(key)||"[]");

 document.getElementById("content").innerHTML=`

 <div class="card">

 <button class="secondary"
 onclick="openClass('${level}')">
 ← Back
 </button>

 <h2>💬 Live Discussion</h2>

 <p><b>${level}</b> → ${unit}</p>

 <textarea
 id="message"
 placeholder="Ask a question or share something useful...">
 </textarea>

 <button onclick="post('${level}','${unit}')">
 📤 Post
 </button>

 </div>

 <div id="posts">

 ${posts.length
 ?
 posts.map(p=>`

  <div class="post">

   ${escapeHTML(p.text)}

   <small>
    <br>${p.time}
   </small>

  </div>

 `).join("")
 :
 `<div class="card">
  No posts yet. Start the discussion.
 </div>`
 }

 </div>
 `;
}


function post(level,unit){

 const message=
 document.getElementById("message").value.trim();

 if(!message){
  alert("Write a message first.");
  return;
 }

 const key="cphDiscussion_"+level+"_"+unit;

 const posts=
 JSON.parse(localStorage.getItem(key)||"[]");

 posts.push({
  text:message,
  time:new Date().toLocaleString()
 });

 localStorage.setItem(key,JSON.stringify(posts));

 discussion(level,unit);
}


/* =========================
   SAVED
========================= */

function save(level,unit){

 const data=
 JSON.parse(localStorage.getItem("cphSaved")||"[]");

 if(!data.some(x=>x.level===level&&x.unit===unit)){

  data.push({level,unit});

  localStorage.setItem("cphSaved",JSON.stringify(data));

 }

 alert("🔖 Saved successfully.");
}


function saved(){

 const data=
 JSON.parse(localStorage.getItem("cphSaved")||"[]");

 document.getElementById("content").innerHTML=`

 <div class="card">

 <h2>🔖 Saved Materials</h2>

 ${
 data.length
 ?
 data.map(x=>`

  <div class="post">

   <b>${x.level}</b><br>
   ${x.unit}<br>

   <button onclick="openClass('${x.level}')">
    Open
   </button>

  </div>

 `).join("")
 :
 "<p>No saved materials yet.</p>"
 }

 </div>
 `;
}


/* =========================
   PROGRESS
========================= */

function progress(){

 document.getElementById("content").innerHTML=`

 <div class="card">

 <h2>📊 Progress</h2>

 <p>
 Quiz progress tracking will appear here as you
 complete unit quizzes.
 </p>

 <button onclick="quizClasses()">
 Start a Quiz
 </button>

 </div>
 `;
}


/* =========================
   SEARCH
========================= */

function focusSearch(){

 document.getElementById("search").focus();
}


function searchCourses(){

 const q=
 document.getElementById("search").value
 .toLowerCase().trim();

 if(!q){
  home();
  return;
 }

 let results=[];

 Object.keys(curriculum).forEach(level=>{

  curriculum[level].forEach(unit=>{

   if(
    level.toLowerCase().includes(q) ||
    unit.toLowerCase().includes(q)
   ){

    results.push({level,unit});

   }

  });

 });

 document.getElementById("content").innerHTML=`

 <div class="card">

 <h2>🔎 Search Results</h2>

 <p>${results.length} result(s)</p>

 </div>

 ${
 results.length
 ?
 results.map(x=>`

  <div class="card">

   <h3>${x.level}</h3>

   <p>📖 ${x.unit}</p>

   <button onclick="openClass('${x.level}')">
    Open
   </button>

  </div>

 `).join("")
 :
 `<div class="card">
  No matching course found.
 </div>`
 }
 `;
}


/* =========================
   SETTINGS
========================= */

function settings(){

 document.getElementById("content").innerHTML=`

 <div class="card">

 <h2>⚙️ Settings</h2>

 <button onclick="toggleDark()">
 🌙 Dark Mode
 </button>

 <button onclick="notifyUser()">
 🔔 Notifications
 </button>

 </div>
 `;
}


function toggleDark(){

 document.body.style.background=
 document.body.style.background==="rgb(15, 23, 42)"
 ?
 "#f4f7fb"
 :
 "#0f172a";

 document.body.style.color=
 document.body.style.color==="white"
 ?
 "#172033"
 :
 "white";
}


function notifyUser(){

 if(!("Notification" in window)){

  alert("Notifications are not supported.");

  return;
 }

 Notification.requestPermission().then(p=>{

  if(p==="granted"){
   alert("🔔 Notifications enabled.");
  }else{
   alert("Notification permission was not granted.");
  }

 });

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

 const div=document.createElement("div");

 div.textContent=text;

 return div.innerHTML;
}

</script>

</body>
   </html>
