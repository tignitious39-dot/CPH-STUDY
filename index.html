<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0757a0">
<title>CPH STUDY</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#172033;
line-height:1.6;
}

header{
background:#0757a0;
color:white;
padding:16px;
position:sticky;
top:0;
z-index:100;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
display:flex;
align-items:center;
gap:10px;
}

.logo-icon{font-size:32px}

.logo h1{font-size:22px}

.logo small{
display:block;
opacity:.85;
}

.menu{
background:white;
color:#0757a0;
border:0;
padding:9px 12px;
border-radius:8px;
font-size:18px;
}

nav{
display:none;
background:white;
box-shadow:0 3px 10px #0002;
padding:8px;
}

nav button{
display:block;
width:100%;
padding:12px;
border:0;
background:white;
text-align:left;
font-size:15px;
border-bottom:1px solid #eee;
}

main{
max-width:1100px;
margin:auto;
padding:18px;
}

.hero{
background:linear-gradient(135deg,#0757a0,#1288d5);
color:white;
padding:28px 20px;
border-radius:16px;
margin-bottom:18px;
}

.hero h2{
font-size:29px;
margin-bottom:8px;
}

.search{
margin-bottom:22px;
}

.search input{
width:100%;
padding:14px;
font-size:16px;
border:1px solid #ccd7e5;
border-radius:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:16px;
margin-top:15px;
}

.card{
background:white;
border-radius:14px;
padding:18px;
box-shadow:0 3px 12px #0001;
}

.card h2,.card h3{
color:#0757a0;
}

.card p{
color:#526174;
}

.card button,
.action{
background:#0757a0;
color:white;
border:0;
border-radius:8px;
padding:11px 14px;
margin-top:12px;
cursor:pointer;
}

.semester{
border-top:6px solid #0757a0;
}

.blue{border-top-color:#1677d2}
.green{border-top-color:#159447}
.yellow{border-top-color:#d6a800}
.red{border-top-color:#d52c35}

.unit{
background:#f7faff;
border:1px solid #dce5ef;
padding:12px;
margin:8px 0;
border-radius:9px;
cursor:pointer;
}

.unit:hover{
background:#e8f3ff;
}

.topic{
padding:12px;
margin:7px 0;
background:#f7faff;
border-radius:8px;
border-left:4px solid #0757a0;
}

.note{
background:white;
padding:20px;
border-radius:14px;
box-shadow:0 3px 12px #0001;
}

.note h2,.note h3{
color:#0757a0;
margin-bottom:10px;
}

.note h3{
margin-top:20px;
}

.note li{
margin:7px 0 7px 20px;
}

.option{
display:block;
width:100%;
text-align:left;
background:white;
color:#172033;
border:1px solid #ccd8e5;
padding:12px;
border-radius:8px;
margin:8px 0;
}

footer{
margin-top:35px;
background:#102a43;
color:white;
text-align:center;
padding:25px;
}

.hidden{display:none}

.dark{
background:#101820;
color:#eee;
}

.dark .card,
.dark .note,
.dark nav,
.dark .unit,
.dark .topic,
.dark .option{
background:#1b2935;
color:#eee;
}

.dark .card p{
color:#cbd5e1;
}

.dark nav button{
background:#1b2935;
color:white;
}

@media(max-width:600px){
main{padding:13px}
.hero h2{font-size:25px}
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
<div class="logo-icon">⚕️</div>
<div>
<h1>CPH STUDY</h1>
<small>Learn • Practice • Master</small>
</div>
</div>

<button class="menu" onclick="toggleMenu()">☰</button>

</div>
</header>

<nav id="nav">

<button onclick="home()">🏠 Home</button>
<button onclick="curriculum()">📚 Curriculum</button>
<button onclick="quiz()">📝 MCQ Practice</button>
<button onclick="calculations()">🧮 Calculations</button>
<button onclick="progress()">📊 Progress</button>
<button onclick="darkMode()">🌙 Dark Mode</button>

</nav>

<main>

<section id="home">

<div class="hero">

<h2>Welcome to CPH STUDY</h2>

<p>
Your Certificate in Pharmacy learning companion.
Study your curriculum, practise questions and prepare for examinations.
</p>

</div>

<div class="search">

<input
id="search"
placeholder="🔎 Search a course or unit..."
oninput="searchCourses()">

</div>

<h2>📚 CPH Curriculum</h2>

<div id="semesters" class="grid"></div>

<div class="card" style="margin-top:20px;text-align:center">

<h3>💡 Daily Motivation</h3>

<p id="quote"></p>

</div>

</section>

<section id="content"></section>

</main>

<footer>

<strong>⚕️ CPH STUDY</strong>

<p>
Certificate in Pharmacy • Learn • Practice • Master
</p>

</footer>

<script>

/* =========================
   OFFICIAL COURSE STRUCTURE
========================= */

const semesters=[

{
name:"CPH 1.1",
icon:"🟦",
className:"blue",
units:[
"Microbiology",
"Anatomy & Physiology 1",
"Pharmaceutical Chemistry 1",
"First Aid",
"Primary Health Care (PHC)",
"Computer Applications"
]
},

{
name:"CPH 1.2",
icon:"🟩",
className:"green",
units:[
"Anatomy & Physiology 2",
"Pharmaceutical Chemistry 2",
"Pharmaceutical Calculations",
"Pharmacognosy",
"Pharmacology 1",
"Medical Psychology",
"Communication Skills",
"Pharmaceutical Practicals"
]
},

{
name:"CPH 2.1",
icon:"🟨",
className:"yellow",
units:[
"Pharmaceutics 1",
"Pharmacy Laws & Regulations",
"Pharmacy Practice 1",
"Therapeutics 1",
"Pharmacology 2",
"Stores & Inventory Management",
"Field Attachment I"
]
},

{
name:"CPH 2.2",
icon:"🟥",
className:"red",
units:[
"Pharmaceutics 2",
"Quality Assurance of Pharmaceuticals",
"Pharmacy Practice 2",
"Therapeutics 2",
"Entrepreneurship",
"Field Attachment II"
]
}

];


/* =========================
   TOPICS FROM CURRICULUM
========================= */

const topics={

"Pharmaceutical Calculations":[
"Mathematics Review",
"Fractions, Ratios and Proportions",
"Decimals and Percentages",
"Measurement Systems and Conversions",
"Scaling Formulae",
"Dilution and Concentration",
"Alligation",
"Parts Per Million",
"Dosage and Posology"
],

"Pharmaceutics 2":[
"Simple Solutions",
"Excipients",
"Production Formulae",
"Concentration Expressions",
"Percentage Strength",
"Ratio Strength",
"Parts Per Million",
"Scaling",
"Posology",
"Adult and Child Doses",
"Reconstitution",
"Mixing and Storage",
"Antiseptic and Disinfectant Dilution"
],

"Quality Assurance of Pharmaceuticals":[
"Quality Assurance",
"Quality Control",
"Good Manufacturing Practice",
"Medicine Quality",
"Inspection and Testing",
"Supplier Selection",
"Certification",
"Storage Controls",
"Distribution Controls",
"Monitoring",
"Medicine Recalls",
"Medicines and Therapeutics Committee"
]

};


/* =========================
   MENU
========================= */

function toggleMenu(){

const nav=document.getElementById("nav");

nav.style.display=
nav.style.display==="block"
?"none"
:"block";

}


/* =========================
   HOME
========================= */

function home(){

document.getElementById("home").classList.remove("hidden");

document.getElementById("content").innerHTML="";

window.scrollTo({top:0,behavior:"smooth"});

}


/* =========================
   CURRICULUM
========================= */

function curriculum(){

document.getElementById("home").classList.add("hidden");

renderCurriculum();

window.scrollTo({top:0,behavior:"smooth"});

}


function renderCurriculum(){

document.getElementById("content").innerHTML=`

<h2>📚 CPH Curriculum</h2>

<p style="margin-top:5px">
Select a semester, then select a course unit.
</p>

<div class="grid">

${semesters.map((semester,index)=>`

<div class="card semester ${semester.className}">

<h2>
${semester.icon}
${semester.name}
</h2>

<p>
${semester.units.length} course units
</p>

<div style="margin-top:15px">

${semester.units.map((unit,j)=>`

<div
class="unit"
onclick="openUnit(${index},${j})">

📖 ${unit}

</div>

`).join("")}

</div>

</div>

`).join("")}

</div>

`;

}


/* =========================
   COURSE UNIT
========================= */

function openUnit(semesterIndex,unitIndex){

const semester=semesters[semesterIndex];

const unit=semester.units[unitIndex];

const unitTopics=
topics[unit] || [

"Course Introduction",
"Course Objectives",
"Key Concepts",
"Core Knowledge",
"Applications in Pharmacy Practice",
"Revision Summary",
"Examination Preparation"

];

document.getElementById("content").innerHTML=`

<div class="note">

<h2>
${semester.icon}
${unit}
</h2>

<p>
<strong>${semester.name}</strong>
</p>

<hr style="margin:15px 0">

<h3>📖 Study Topics</h3>

${unitTopics.map((topic,index)=>`

<div
class="topic"
onclick="openTopic('${unit}','${topic}')">

${index+1}. ${topic}

</div>

`).join("")}

<h3>📝 Examination Practice</h3>

<p>
Test yourself with MCQs and structured questions.
</p>

<button class="action" onclick="quiz()">
📝 Start MCQs
</button>

<button class="action" onclick="calculations()">
🧮 Calculations
</button>

<br>

<button class="action" onclick="curriculum()">
← Back to Curriculum
</button>

</div>

`;

window.scrollTo({top:0,behavior:"smooth"});

}


/* =========================
   TOPIC
========================= */

function openTopic(unit,topic){

document.getElementById("content").innerHTML=`

<div class="note">

<p>
<strong>📚 ${unit}</strong>
</p>

<h2>📖 ${topic}</h2>

<h3>Learning Objective</h3>

<p>
Understand the fundamental principles of ${topic}
and apply them appropriately in pharmacy learning and practice.
</p>

<h3>Core Notes</h3>

<p>
Detailed curriculum-based notes for this topic will be
organized here with definitions, explanations, examples,
important points and examination guidance.
</p>

<h3>🧠 Key Points</h3>

<ul>
<li>Understand the relevant terminology.</li>
<li>Learn the underlying principles.</li>
<li>Apply the knowledge to pharmacy practice.</li>
<li>Review examination points.</li>
</ul>

<h3>📝 Practice</h3>

<button class="action" onclick="quiz()">
Start MCQs
</button>

<br>

<button class="action" onclick="curriculum()">
← Back to Curriculum
</button>

</div>

`;

window.scrollTo({top:0,behavior:"smooth"});

}


/* =========================
   SEARCH
========================= */

function searchCourses(){

const query=
document.getElementById("search")
.value
.toLowerCase()
.trim();

if(!query){

home();

return;

}

document.getElementById("home").classList.add("hidden");

let results=[];

semesters.forEach((semester,i)=>{

semester.units.forEach((unit,j)=>{

if(
semester.name.toLowerCase().includes(query) ||
unit.toLowerCase().includes(query)
){

results.push({
semesterIndex:i,
unitIndex:j,
semester,
unit
});

}

});

});

document.getElementById("content").innerHTML=`

<h2>🔎 Search Results</h2>

<div class="grid">

${
results.length

?

results.map(item=>`

<div class="card">

<h3>
${item.semester.icon}
${item.unit}
</h3>

<p>
${item.semester.name}
</p>

<button
onclick="openUnit(${item.semesterIndex},${item.unitIndex})">

Open Course

</button>

</div>

`).join("")

:

`<div class="card">
<h3>No results found</h3>
<p>Try another course or unit name.</p>
</div>`

}

</div>

`;

}


/* =========================
   MCQ SYSTEM
========================= */

const questions=[

{
q:"What is pharmacology?",
options:[
"The study of drugs and their effects",
"The study of bones",
"The study of food",
"The study of computers"
],
answer:0,
explanation:"Pharmacology is the study of drugs and their effects on living organisms."
},

{
q:"What does pharmacokinetics describe?",
options:[
"What the drug does to the body",
"What the body does to the drug",
"Only adverse drug reactions",
"Only drug manufacture"
],
answer:1,
explanation:"Pharmacokinetics describes absorption, distribution, metabolism and excretion."
},

{
q:"Which formula is commonly used for dilution calculations?",
options:[
"C₁V₁ = C₂V₂",
"E = mc²",
"F = ma",
"P = IV"
],
answer:0,
explanation:"C₁V₁ = C₂V₂ is commonly used for dilution calculations."
},

{
q:"Which organ pumps blood around the body?",
options:[
"Liver",
"Heart",
"Kidney",
"Lung"
],
answer:1,
explanation:"The heart pumps blood through the cardiovascular system."
},

{
q:"What is homeostasis?",
options:[
"Complete absence of change",
"Maintenance of a relatively stable internal environment",
"Digestion of food",
"Movement of bones"
],
answer:1,
explanation:"Homeostasis is maintenance of relatively stable internal conditions."
}

];

let quizIndex=0;

let quizScore=0;


function quiz(){

document.getElementById("home").classList.add("hidden");

quizIndex=0;

quizScore=0;

showQuestion();

window.scrollTo({top:0,behavior:"smooth"});

}


function showQuestion(){

const question=questions[quizIndex];

document.getElementById("content").innerHTML=`

<div class="card">

<h2>📝 CPH MCQ Practice</h2>

<p>
Question ${quizIndex+1}
of ${questions.length}
</p>

<hr style="margin:12px 0">

<h3>${question.q}</h3>

<div style="margin-top:15px">

${question.options.map((option,index)=>`

<button
class="option"
onclick="answerQuestion(${index})">

${String.fromCharCode(65+index)}.
${option}

</button>

`).join("")}

</div>

</div>

`;

}


function answerQuestion(selected){

const question=questions[quizIndex];

const buttons=
document.querySelectorAll(".option");

buttons.forEach(button=>{
button.disabled=true;
});

if(selected===question.answer){

quizScore++;

buttons[selected].style.border=
"3px solid green";

}else{

buttons[selected].style.border=
"3px solid red";

buttons[question.answer].style.border=
"3px solid green";

}

const explanation=document.createElement("p");

explanation.style.marginTop="15px";

explanation.innerHTML=
"<strong>Explanation:</strong> "
+
question.explanation;

document.querySelector(".card").appendChild(explanation);

setTimeout(()=>{

quizIndex++;

if(quizIndex<questions.length){

showQuestion();

}else{

finishQuiz();

}

},900);

}


function finishQuiz(){

const percentage=
Math.round(
quizScore/questions.length*100
);

const history=
JSON.parse(
localStorage.getItem("cphHistory")||"[]"
);

history.push({

score:quizScore,

total:questions.length,

percentage:percentage,

date:new Date().toLocaleString()

});

localStorage.setItem(
"cphHistory",
JSON.stringify(history)
);

document.getElementById("content").innerHTML=`

<div class="card" style="text-align:center">

<h2>🎉 Quiz Complete</h2>

<h1 style="font-size:50px">
${percentage}%
</h1>

<p>
You scored
<strong>${quizScore}</strong>
out of
<strong>${questions.length}</strong>.
</p>

<button onclick="quiz()">
Try Again
</button>

<button onclick="progress()">
View Progress
</button>

</div>

`;

}


/* =========================
   CALCULATIONS
========================= */

function calculations(){

document.getElementById("home").classList.add("hidden");

document.getElementById("content").innerHTML=`

<div class="note">

<h2>🧮 Pharmaceutical Calculations</h2>

<h3>Dilution</h3>

<p>
<strong>C₁V₁ = C₂V₂</strong>
</p>

<h3>Dose Calculation</h3>

<p>
Volume required =
Dose required ÷ Dose available
× Volume containing the available dose.
</p>

<h3>Allegation</h3>

<p>
Allegation is a method used to determine the proportions
of preparations of different strengths required to produce
a mixture of a desired intermediate strength.
</p>

<h3>📝 Practice Question</h3>

<p>
A solution contains 500 mg in 5 mL.
How many milligrams are contained in 2 mL?
</p>

<input
id="calcAnswer"
type="number"
placeholder="Enter answer in mg"
style="
width:100%;
padding:13px;
margin-top:10px;
border:1px solid #ccd7e5;
border-radius:8px;
">

<button
class="action"
onclick="checkCalculation()">

Check Answer

</button>

<p id="calcResult" style="margin-top:15px"></p>

</div>

`;

}


function checkCalculation(){

const answer=
Number(
document.getElementById("calcAnswer").value
);

const result=
document.getElementById("calcResult");

if(answer===200){

result.innerHTML=
"✅ Correct! 500 ÷ 5 = 100 mg/mL. 100 × 2 = 200 mg.";

}else{

result.innerHTML=
"❌ Try again. First calculate the amount per mL.";

}

}


/* =========================
   PROGRESS
========================= */

function progress(){

document.getElementById("home").classList.add("hidden");

const history=
JSON.parse(
localStorage.getItem("cphHistory")||"[]"
);

if(!history.length){

document.getElementById("content").innerHTML=`

<div class="card">

<h2>📊 Progress</h2>

<p>
No quizzes completed yet.
</p>

<button onclick="quiz()">
Take a Quiz
</button>

</div>

`;

return;

}

const average=Math.round(
history.reduce(
(sum,item)=>sum+item.percentage,0
)/history.length
);

document.getElementById("content").innerHTML=`

<div class="grid">

<div class="card">

<h3>📈 Average Score</h3>

<h2>${average}%</h2>

</div>

<div class="card">

<h3>📝 Quizzes Completed</h3>

<h2>${history.length}</h2>

</div>

</div>

<div class="card" style="margin-top:18px">

<h2>Recent Attempts</h2>

${history.slice(-10).reverse().map(item=>`

<div class="unit">

<strong>${item.percentage}%</strong>

—

${item.score}/${item.total}

correct

<br>

<small>${item.date}</small>

</div>

`).join("")}

</div>

`;

}


/* =========================
   DARK MODE
========================= */

function darkMode(){

document.body.classList.toggle("dark");

localStorage.setItem(
"cphDark",
document.body.classList.contains("dark")
);

}


/* =========================
   DAILY MOTIVATION
========================= */

const quotes=[

"Study today. Become better tomorrow.",

"Understand the concept before memorising the details.",

"Consistency creates academic excellence.",

"Every question is an opportunity to learn.",

"Learn • Practice • Master."

];

const day=
Math.floor(Date.now()/86400000);

document.getElementById("quote").textContent=
"💡 "+quotes[day%quotes.length];


/* =========================
   LOAD HOMEPAGE
========================= */

function loadSemesters(){

document.getElementById("semesters").innerHTML=

semesters.map((semester,index)=>`

<div class="card semester ${semester.className}">

<h2>
${semester.icon}
${semester.name}
</h2>

<p>
${semester.units.length}
course units
</p>

<button onclick="openSemester(${index})">
Open Semester
</button>

</div>

`).join("");

}


function openSemester(index){

document.getElementById("home").classList.add("hidden");

const semester=semesters[index];

document.getElementById("content").innerHTML=`

<div class="card">

<h2>
${semester.icon}
${semester.name}
</h2>

<p>
Select a course unit to begin studying.
</p>

<div style="margin-top:15px">

${semester.units.map((unit,j)=>`

<div
class="unit"
onclick="openUnit(${index},${j})">

📖 ${unit}

</div>

`).join("")}

</div>

<button onclick="home()">
← Home
</button>

</div>

`;

window.scrollTo({top:0,behavior:"smooth"});

}


if(localStorage.getItem("cphDark")==="true"){

document.body.classList.add("dark");

}

loadSemesters();

</script>

</body>
  </html>
