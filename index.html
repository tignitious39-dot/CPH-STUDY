<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CPH STUDY</title>

<style>
*{box-sizing:border-box}

:root{
 --blue:#0757a0;
 --blue2:#168ee5;

 --card:#fff;
 --text:#172033;
 --muted:#657184;
 --border:#d9e1ea;

 --danger:#dc3545;

body{
 margin:0;

 background:var(--bg);

body.dark{

 --card:#1e293b;
 --text:#f1f5f9;
 --muted:#aab5c4;

header{

 align-items:center;
 position:sticky;
 top:0;
 z-index:100;
}

.brand{
 display:flex;

 align-items:center;
}

.icon{
 font-size:32px;
}

.title{
 font-size:20px;
 font-weight:bold;
}

.small{
 font-size:12px;

}

header button{
 background:rgba(255,255,255,.16);
 color:white;
 border:0;
 border-radius:9px;
 padding:9px 12px;
 font-size:20px;
}

main{
 max-width:1050px;
 margin:auto;
 padding:16px 14px 100px;
}

.hero{
 background:linear-gradient(135deg,#0757a0,#168ee5);
 color:white;
 padding:24px;
 border-radius:18px;
 margin-bottom:18px;
}

.hero h1{
 margin:0 0 5px;
 font-size:28px;
}

.quote{
 margin-top:15px;
 padding:13px;
 background:rgba(255,255,255,.15);
 border-radius:10px;
}

.search{
 margin-bottom:20px;
}

.search input,
textarea,
input[type=text]{
 width:100%;
 padding:14px;
 border:1px solid var(--border);
 border-radius:10px;
 font:inherit;
 background:var(--card);
 color:var(--text);
 outline:none;
}

textarea{
 min-height:120px;
 resize:vertical;
}

h2{
 margin-top:20px;
 margin-bottom:14px;
}

h3{
 margin-top:0;
}

.card{
 background:var(--card);
 border-radius:14px;
 padding:17px;
 margin-bottom:13px;
 box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
 gap:12px;
}

button{
 border:0;
 border-radius:9px;
 padding:11px 14px;
 margin:4px;
 background:var(--blue);
 color:white;
 cursor:pointer;
 font-size:14px;
}

button:hover{
 opacity:.9;
}

button:disabled{
 opacity:.6;
 cursor:not-allowed;
}

.secondary{
 background:#eaf1f8;
 color:var(--blue);
}

.dark .secondary{
 background:#334155;
 color:#dbeafe;
}

.success{
 background:var(--success);
}

.danger{
 background:var(--danger);
}

.tool{
 width:100%;
 min-height:95px;
 font-size:26px;
}

.tool span{
 display:block;
 font-size:14px;
 margin-top:5px;
}

.class-card{
 border-left:5px solid var(--blue);
 cursor:pointer;
}

.unit-card{
 border-left:5px solid var(--blue2);
}

.unit-buttons{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 margin-top:12px;
}

.unit-buttons button{
 margin:0;
}

.note{
 background:#f8fbff;
 color:#172033;
 border-left:4px solid var(--blue);
 padding:15px;
 border-radius:8px;
 margin:12px 0;

.dark .note{
 background:#263449;
 color:#f1f5f9;
}

.note h4{
 margin:16px 0 5px;
}

.note ul{
 padding-left:22px;
}

.quiz-answer{

 width:100%;
 text-align:left;
 background:#eef3f8;
 color:#172033;
 border:2px solid transparent;
 margin:8px 0;
}

.dark .quiz-answer{
 background:#334155;
 color:#f1f5f9;
}

.quiz-answer.correct{
 border-color:var(--success);
}

.quiz-answer.wrong{
 border-color:var(--danger);
}

 background:#edf6ff;
 color:#172033;

 padding:13px;
 border-radius:8px;
 margin-top:12px;

.dark .explanation{
 background:#263449;
 color:#f1f5f9;
}

 background:#f5f8fb;
 color:#172033;
 padding:13px;
 border-left:4px solid var(--blue2);
 border-radius:9px;
 margin:10px 0;
}

.dark .post{
 background:#263449;
 color:#f1f5f9;
}

.post small{
 color:#687386;
}

.stat-grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;

.stat{
 background:#eef3f8;
 color:#172033;
 padding:15px;
 border-radius:10px;
 text-align:center;
}

.dark .stat{
 background:#334155;
 color:#f1f5f9;

.stat strong{
 display:block;
 font-size:25px;
 color:var(--blue);
}

.empty{
 text-align:center;
 padding:30px;

.badge{

 border-radius:20px;

 color:var(--blue);
 font-size:12px;
 margin:3px;

 left:0;
 right:0;

 display:grid;

</head>

function updateQuote(){

 const hour=new Date().getHours();

 document.getElementById("quote").textContent=
 quotes[hour%quotes.length];
}

updateQuote();

/* Updates every minute and therefore changes automatically

/* =====================================================

===================================================== */

/*
  Default structured notes are generated for every
  curriculum unit. This prevents empty course pages.
*/

Object.keys(curriculum).forEach(level=>{

 curriculum[level].forEach(unit=>{

  notesDB[level+"|"+unit]=generateNotes(level,unit);

 });

});


function generateNotes(level,unit){

 return {

  introduction:
  `${unit} is studied under ${level} in the CPH STUDY curriculum. This section provides an organized framework for studying the unit, reviewing important concepts and preparing for examination questions.`,

  objectives:[
   `Define and explain important terminology used in ${unit}.`,
   `Identify the major principles and concepts in the unit.`,
   `Explain important relationships, processes or mechanisms.`,
   `Apply knowledge to pharmacy-related situations.`,
   `Answer examination-style questions accurately.`
  ],

  areas:[
   "Definitions and terminology",
   "Classification and categories",
   "Core principles",
   "Important processes and mechanisms",
   "Practical pharmacy applications",
   "Common examination points",
   "Revision questions and self-testing"
  ],

  study:
  `Begin with the basic terminology of ${unit}. Build understanding from simple concepts to more advanced applications. After each topic, close your notes and recall the major points without looking. Finish by testing yourself with questions from this exact class and unit.`,

  exam:
  `For examination preparation, pay particular attention to definitions, classifications, comparisons, principles, procedures, applications and questions requiring explanation. Always read the question carefully and answer according to the command word such as define, list, explain, describe, compare or calculate.`

 };

}
