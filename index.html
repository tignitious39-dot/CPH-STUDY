<style>
*{box-sizing:border-box}

:root{
  --primary:#0757a0;
  --secondary:#168ee5;
  --bg:#f4f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#687386;
  --border:#dce4ed;
  --soft:#eef6ff;
  --success:#198754;
  --danger:#dc3545;
}

body{

body.dark{

  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 8px #0002;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{

  height:43px;
  background:white;
  color:#0757a0;
  border-radius:50%;

  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
}

.brand-title{
  font-size:20px;
  font-weight:bold;
}

.brand-sub{
  font-size:11px;
  opacity:.9;
}

header button{

  color:white;
  border:0;
  font-size:21px;
  padding:9px 12px;
  border-radius:10px;
}

main{

  margin:auto;
  padding:15px 13px 95px;
}

.hero{

  color:white;
  padding:22px;

}

.hero h1{

  font-size:27px;
}

.hero p{

}

.quote{

}

.search{
  margin-bottom:17px;
}

.search input{

  padding:14px;
  border:1px solid var(--border);
  border-radius:12px;
  font-size:16px;

  background:var(--card);

}

.card{

  border-radius:14px;
  padding:17px;
  margin-bottom:13px;
  box-shadow:0 3px 12px #00000012;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:12px;
}

.class-card,
.unit-card{
  cursor:pointer;
  transition:.15s;
}

.class-card{
  border-left:5px solid var(--primary);
}

.unit-card{
  border-left:5px solid var(--secondary);
}

.class-card:hover,
.unit-card:hover{
  transform:translateY(-2px);
}

button{
  border:0;
  border-radius:9px;
  padding:11px 14px;
  margin:4px;
  background:var(--primary);
  color:white;
  cursor:pointer;
  font-size:14px;
}

button:hover{

}

.secondary{
  background:#eaf1f8;
  color:var(--primary);

.dark .secondary{

.success{background:var(--success)}
.danger{background:var(--danger)}

.tool span{

  font-size:14px;
  margin-top:5px;
}

.unit-actions{

  grid-template-columns:repeat(2,1fr);
  gap:7px;
  margin-top:12px;

.unit-actions button{

  border-radius:8px;

.topic{

  border-radius:9px;
  padding:13px;
  margin:10px 0;

.topic h4{
  margin:0 0 7px;
}

.question{
  font-size:18px;
  font-weight:bold;
  margin:16px 0;
}

.answer{
  display:block;
  width:100%;
  text-align:left;
  background:#f1f5f9;
  color:#172033;
  border:2px solid #d8e0e8;
  margin:8px 0;
}

.dark .answer{
  background:#243144;
  color:white;
  border-color:#46546a;
}

.answer.correct{
  border-color:var(--success);
  background:#e9f8ef;
}

.answer.wrong{
  border-color:var(--danger);
  background:#fff0f0;
}

.explanation{
  background:var(--soft);
  border-left:4px solid var(--primary);
  padding:13px;
  border-radius:8px;
  margin-top:12px;

.paper{

  padding:14px;
  background:var(--soft);
  margin:10px 0;
  border-radius:8px;
}

.badge{
  display:inline-block;
  background:#eaf1f8;
  color:var(--primary);
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  margin:3px;
}

.dark .badge{
  background:#29394d;
  color:#fff;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:var(--soft);
  padding:15px;
  border-radius:10px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:25px;
  color:var(--primary);
}

.progress{
  height:12px;
  background:#dce4ed;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:var(--secondary);
  width:0%;

textarea{
  width:100%;
  min-height:110px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:9px;
  font:inherit;
  resize:vertical;
  background:var(--card);
  color:var(--text);
}

.empty{
  text-align:center;
  padding:30px;
  color:var(--muted);

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:var(--card);
  border-top:1px solid var(--border);

function loadStorage(key, fallback){
  try{
    const data = localStorage.getItem(key);

    if(data === null) return fallback;

    return JSON.parse(data);

  }catch(error){
    console.warn("Storage read error:",error);
    return fallback;
  }
}

function saveStorage(key,value){
  try{
    localStorage.setItem(key,JSON.stringify(value));
  }catch(error){
    console.warn("Storage save error:",error);
  }
}

    .replace(/"/g,"&quot;")
