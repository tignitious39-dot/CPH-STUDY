<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#0757a0">

<title>CPH STUDY</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f3f7fb;
color:#172033;
line-height:1.6;
}

header{
background:#0757a0;
color:white;
padding:15px;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 2px 10px #0003;
}

.header{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:22px;
font-weight:bold;
}

.menu{
background:white;
color:#0757a0;
font-size:22px;
padding:6px 12px;
}

nav{
display:none;
background:white;
box-shadow:0 2px 10px #0002;
}

nav button{
display:block;
width:100%;
border:0;
background:white;
color:#172033;
text-align:left;
padding:14px 20px;
font-size:16px;
}

main{
max-width:1100px;
margin:auto;
padding:18px;
}

.hero{
background:linear-gradient(135deg,#0757a0,#1596df);
color:white;
padding:30px 22px;
border-radius:18px;
margin-bottom:20px;
}

.hero h1{
margin:0 0 8px;
font-size:32px;
}

.search{
width:100%;
padding:15px;
border:1px solid #ccd7e5;
border-radius:10px;
font-size:16px;
margin-bottom:18px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:15px;
}

.card{
background:white;
border-radius:15px;
padding:18px;
margin-bottom:15px;
box-shadow:0 3px 12px #0001;
}

.semester{
border-left:7px solid #0757a0;
}

.course{
background:#f7fbff;
border:1px solid #d9e6f2;
border-radius:10px;
padding:14px;
margin:8px 0;
cursor:pointer;
}

.course:hover{
background:#eaf5ff;
}

.paper{
background:#fff;
border:1px solid #d8e1eb;
padding:13px;
margin:7px 0;
border-radius:9px;
cursor:pointer;
}

.paper:hover{
background:#eef7ff;
}

button{
background:#0757a0;
color:white;
border:0;
border-radius:9px;
padding:11px 15px;
margin:5px 3px;
cursor:pointer;
font-size:15px;
}

button.secondary{
background:#607080;
}

button.success{
background:#218739;
}

button.warning{
background:#b77900;
}

h1,h2,h3{
color:#0757a0;
}

.hero h1{
color:white;
}

.badge{
display:inline-block;
padding:4px 10px;
border-radius:20px;
background:#e5f2ff;
color:#0757a0;
font-size:13px;
margin:2px;
}

.note{
background:#eef7ff;
padding:15px;
border-radius:10px;
border-left:5px solid #0757a0;
margin:12px 0;
}

.question{
padding:14px;
background:#fafafa;
border:1px solid #ddd;
border-radius:10px;
margin:10px 0;
}

.option{
display:block;
width:100%;
text-align:left;
background:#f2f6fa;
color:#172033;
border:1px solid #ccd7e5;
}

.option:hover{
background:#e5f1fb;
}

.correct{
border:3px solid #16852d !important;
}

.wrong{
border:3px solid #c62828 !important;
}

textarea,
input{
font-family:inherit;
}

textarea{
width:100%;
min-height:120px;
padding:12px;
border:1px solid #ccd7e5;
border-radius:9px;
}

.progressbar{
height:18px;
background:#e2e8ef;
border-radius:20px;
overflow:hidden;
margin:10px 0;
}

.progressfill{
height:100%;
background:#0757a0;
width:0%;
}

footer{
background:#102a43;
color:white;
text-align:center;
padding:25px;
margin-top:30px;
}

.dark{
background:#101820;
color:#eee;
}

.dark .card,
.dark nav,
.dark .course,
.dark .paper,
.dark .question{
background:#1c2935;
color:#eee;
}

.dark nav button{
background:#1c2935;
color:white;
}

.dark .option{
background:#243544;
color:white;
}

@media(max-width:600px){
.hero h1{font-size:27px}
main{padding:12px}
}

function showSemester(semester){

<h2>📚 ${semester}</h2>

<p>Select a course unit.</p>

${curriculum[semester].map((course,i)=>`

<div class="course"

<b>${i+1}. ${course}</b>

<br>

<span class="badge">
20 Papers
</span>

<span class="badge">
Study Notes
</span>

<span class="badge">
MCQs
</span>

</div>

`).join("")}

</div>

`;

}


/* =========================================================
   COURSE
========================================================= */

function showCourse(course){

currentCourse=course;

let list=topics[course] || [];

app.innerHTML=`

<div class="card">

<h2>📖 ${course}</h2>

<p>
Select one of the 20 papers below.
</p>

${list.map((topic,i)=>`

<div class="paper"
onclick="openPaper(${i})">

<b>Paper ${i+1}</b>

<br>

${topic}

</div>

`).join("")}

<button onclick="home()">← Home</button>

</div>

`;

}


/* =========================================================
   PAPER
========================================================= */

function openPaper(index){

currentPaper=index;

let topic=topics[currentCourse][index];

let done=isComplete(currentCourse,index);

app.innerHTML=`

<div class="card">

<span class="badge">${currentCourse}</span>

<span class="badge">Paper ${index+1}/20</span>

<h2>📝 Paper ${index+1}: ${topic}</h2>

<div class="note">

<b>Study focus</b>

<p>
This paper focuses on <b>${topic}</b>.
Study the terminology, principles, classification,
applications, practical relevance, safety considerations
and examination points related to this topic.
</p>

</div>


<h3>📖 Detailed Study Notes</h3>

<p>
<strong>Definition and concept:</strong>
Begin by defining the major terms associated with
${topic}. Understand what the concept means before
memorising details.
</p>

<p>
<strong>Core principles:</strong>
Identify the major principles, classifications,
characteristics, mechanisms, procedures or stages
associated with ${topic}.
</p>

<p>
<strong>Pharmacy relevance:</strong>
Relate the topic to safe, effective and professional
pharmacy practice. Consider how the knowledge may
affect medicines, patients, dispensing, counselling,
storage, calculations, public health or laboratory work,
depending on the course.
</p>

<p>
<strong>Examination approach:</strong>
For a structured question, define the concept first,
organise the answer under clear headings, explain each
point and provide appropriate examples where required.
</p>


<h3>🔑 Key Revision Points</h3>

<ul>

<li>Know the important definitions.</li>

<li>Know the major classifications.</li>

<li>Understand the underlying principles.</li>

<li>Know important examples and applications.</li>

<li>Understand the relevance to pharmacy practice.</li>

<li>Review safety and professional considerations.</li>

<li>Practise explaining the topic without notes.</li>

</ul>


<h3>🧠 MCQ Practice</h3>

<div class="question">

<b>1. What should you do first when studying ${topic}?</b>

<button class="option"
onclick="answer(this,true)">
A. Identify and understand the key concepts
</button>

<button class="option"
onclick="answer(this,false)">
B. Memorise unrelated information
</button>

<button class="option"
onclick="answer(this,false)">
C. Skip the definitions
</button>

<button class="option"
onclick="answer(this,false)">
D. Ignore its pharmacy
