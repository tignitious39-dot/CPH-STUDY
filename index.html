<!DOCTYPE html>
<html lang="en">
<head>

<title>CPH STUDY</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#f4f7fb;
 color:#172033;
 line-height:1.6;
}

header{
 background:linear-gradient(135deg,#064b9b,#087bd3);
 color:#fff;
 padding:14px 16px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 position:sticky;
 top:0;
 z-index:100;
 box-shadow:0 2px 10px #0002;
}

.brand{
 display:flex;
 align-items:center;
 gap:10px;
}

.brand-icon{
 font-size:32px;
}

.brand-title{
 font-size:20px;
 font-weight:bold;
}

.brand-subtitle{
 font-size:11px;
 opacity:.9;
}

header button{
 background:#ffffff22;
 color:#fff;
 border:0;
 font-size:20px;
 padding:9px 12px;
 border-radius:9px;
}

main{
 max-width:1050px;
 margin:auto;
 padding:16px 14px 100px;
}

.hero{
 background:linear-gradient(135deg,#0757a0,#168ee5);
 color:#fff;
 padding:23px;
 border-radius:17px;
 margin-bottom:18px;
}

.hero h1{
 margin:0 0 5px;
 font-size:27px;
}

.quote{
 margin-top:15px;
 padding:12px;
 border-radius:10px;
 background:#ffffff22;
}

.search{
 margin-bottom:18px;
}

.search input{
 width:100%;
 padding:14px;
 border:1px solid #ccd5df;
 border-radius:11px;
 font-size:16px;
 outline:none;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
 gap:12px;
}

.card{
 background:#fff;
 padding:17px;
 border-radius:14px;
 box-shadow:0 3px 12px #00000010;
 margin-bottom:12px;
}

.class-card{
 border-left:5px solid #0757a0;
}

.unit-card{
 border-left:5px solid #168ee5;
}

button{
 border:0;
 border-radius:9px;
 padding:11px 14px;
 margin:4px;
 background:#0757a0;
 color:#fff;
 cursor:pointer;
 font-size:14px;
}

button:hover{
 opacity:.9;
}

button:disabled{
 opacity:.65;
 cursor:not-allowed;
}

.secondary{
 background:#eaf1f8;
 color:#0757a0;
}

.success{
 background:#198754;
}

.danger{
 background:#dc3545;
}

.tool{
 width:100%;
 min-height:95px;
 font-size:25px;
}

.tool span{
 display:block;
 font-size:14px;
 margin-top:5px;
}

.unit-buttons{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
}

.unit-buttons button{
 margin:0;
}

.notes{
 background:#f9fbfd;
 border-left:4px solid #0757a0;
 padding:16px;
 border-radius:8px;
 margin-top:12px;
}

.notes h3{
 color:#0757a0;
 margin-top:22px;
}

.notes h3:first-child{
 margin-top:0;
}

.notes li{
 margin-bottom:7px;
}

.topic{
 background:#fff;
 border:1px solid #e1e7ee;
 border-radius:10px;
 padding:13px;
 margin:10px 0;
}

.question{
 background:#fff;
 padding:17px;
 border-radius:12px;
 margin-bottom:14px;
 box-shadow:0 2px 8px #0001;
}

.answer{
 display:block;
 width:100%;
 text-align:left;
 background:#f1f5f9;
 color:#172033;
 border:1px solid #d5dce5;
 margin:8px 0;
}

.answer.correct{
 border:3px solid #198754;
 background:#eefaf3;
}

.answer.wrong{
 border:3px solid #dc3545;
 background:#fff1f2;
}

.explanation{
 background:#eef6ff;
 border-left:4px solid #0757a0;
 padding:13px;
 border-radius:8px;
 margin-top:12px;
}

.structured{
 border-left:4px solid #168ee5;
 background:#f8fbff;
 padding:15px;
 margin:12px 0;
 border-radius:8px;
}

.paper{
 border:1px solid #dce4ec;
 border-radius:11px;
 padding:15px;
 margin:10px 0;
}

.post{
 background:#f6f9fc;
 border-left:4px solid #168ee5;
 padding:13px;
 border-radius:8px;
 margin:10px 0;
}

.post small{
 color:#687386;
}

.stat-grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
}

.stat{
 background:#eef3f8;
 padding:15px;
 border-radius:10px;
 text-align:center;
}

.stat strong{
 display:block;
 font-size:25px;
 color:#0757a0;
}

.empty{
 text-align:center;
 padding:30px 15px;
 color:#667085;
}

.badge{
 display:inline-block;
 background:#eaf1f8;
 color:#0757a0;
 padding:5px 9px;
 border-radius:20px;
 font-size:12px;
 margin:3px;
}

textarea{
 width:100%;
 min-height:120px;
 padding:12px;
 border:1px solid #ccd5df;
 border-radius:9px;
 font:inherit;
 resize:vertical;
}

nav{
 position:fixed;
 left:0;
 right:0;
 bottom:0;
 background:#fff;
 border-top:1px solid #ddd;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 z-index:200;
}

nav button{
 background:#fff;
 color:#172033;
 margin:0;
 border-radius:0;
 padding:8px 4px;
}

nav span{
 display:block;
 font-size:11px;
}

.dark{
 background:#101722;
 color:#f1f5f9;
}

.dark .card,
.dark nav,
.dark .paper,
.dark .question{
 background:#1b2635;
 color:#f1f5f9;
}

.dark .notes,
.dark .topic,
.dark .structured,
.dark .post,
.dark .stat{
 background:#243144;
 color:#f1f5f9;
}

.dark .search input,
.dark textarea{
 background:#1b2635;
 color:#fff;
 border-color:#46546a;
}

@media(max-width:600px){
 .hero h1{font-size:23px}
 .unit-buttons{grid-template-columns:1fr}
 .stat-grid{grid-template-columns:1fr}
}
</style>
</head>
