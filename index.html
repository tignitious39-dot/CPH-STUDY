<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0757a0">
<title>CPH STUDY</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#f4f7fb;
 color:#172033;
 line-height:1.6;
}
header{
 background:linear-gradient(135deg,#064b9b,#087bd3);
 color:white;
 padding:14px 16px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 position:sticky;
 top:0;
 z-index:100;
 box-shadow:0 2px 10px #0002;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{font-size:32px}
.brand-title{font-size:20px;font-weight:bold}
.brand-subtitle{font-size:11px;opacity:.9}
header button{
 background:#ffffff22;
 color:white;
 border:0;
 font-size:21px;
 padding:8px 12px;
 border-radius:10px;
}
main{
 max-width:1000px;
 margin:auto;
 padding:16px 14px 100px;
}
.hero{
 background:linear-gradient(135deg,#0757a0,#1393e6);
 color:white;
 padding:24px;
 border-radius:18px;
 margin-bottom:18px;
}
.hero h1{margin:0 0 5px;font-size:28px}
.quote{
 margin-top:15px;
 padding:12px;
 background:#ffffff22;
 border-radius:10px;
}
.search{margin-bottom:20px}
.search input{
 width:100%;
 padding:15px;
 border:1px solid #ccd5df;
 border-radius:12px;
 font-size:16px;
 outline:none;
}
h2{margin-top:10px}
h3{margin-bottom:7px}
.card{
 background:white;
 border-radius:14px;
 padding:17px;
 margin-bottom:13px;
 box-shadow:0 3px 12px #0000000d;
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
 gap:12px;
}
button{
 border:0;
 border-radius:9px;
 padding:11px 14px;
 margin:4px;
 background:#0757a0;
 color:white;
 cursor:pointer;
 font-size:14px;
}
button:hover{opacity:.9}
button:disabled{opacity:.65;cursor:not-allowed}
.secondary{
 background:#eaf1f8;
 color:#0757a0;
}
.danger{background:#dc3545}
.success{background:#198754}
.tool{
 width:100%;
 min-height:90px;
 font-size:25px;
}
.tool span{
 display:block;
 font-size:14px;
 margin-top:5px;
}
.unit-buttons{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:7px;
}
.unit-buttons button{margin:0}
.notes{
 background:#fbfdff;
 border-left:4px solid #0757a0;
 padding:16px;
 border-radius:9px;
}
.notes h3{color:#0757a0;margin-top:20px}
.notes ul{padding-left:22px}
.quiz-option{
 display:block;
 width:100%;
 text-align:left;
 background:#f1f5f9;
 color:#172033;
 border:2px solid #d7dee7;
 margin:8px 0;
}
.quiz-option.correct{
 border-color:#198754;
 background:#e9f8ef;
}
.quiz-option.wrong{
 border-color:#dc3545;
 background:#fff0f0;
}
.explanation{
 background:#eef6ff;
 border-left:4px solid #0757a0;
 padding:13px;
 border-radius:8px;
 margin-top:12px;
}
textarea,input[type=text]{
 width:100%;
 padding:12px;
 border:1px solid #ccd5df;
 border-radius:9px;
 font:inherit;
}
textarea{min-height:120px}
.post{
 background:#f5f8fb;
 padding:13px;
 border-left:4px solid #168ee5;
 border-radius:8px;
 margin:10px 0;
}
.stat-grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
}
.stat{
 background:#eef3f8;
 padding:15px;
 text-align:center;
 border-radius:10px;
}
.stat strong{
 display:block;
 font-size:26px;
 color:#0757a0;
}
.badge{
 display:inline-block;
 background:#eaf1f8;
 color:#0757a0;
 padding:4px 8px;
 border-radius:20px;
 font-size:12px;
}
.empty{
 text-align:center;
 padding:25px;
 color:#667085;
}
.hidden{display:none!important}
nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:white;
 border-top:1px solid #ddd;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 padding:6px;
 z-index:200;
}
nav button{
 background:transparent;
 color:#172033;
 margin:0;
 border-radius:7px;
 font-size:18px;
}
nav span{display:block;font-size:11px}
.dark{
 background:#101722;
 color:#f1f5f9;
}
.dark .card,
.dark nav{
 background:#1b2635;
 color:#f1f5f9;
}
.dark .notes,
.dark .post,
.dark .stat,
.dark .quiz-option{
 background:#243144;
 color:#f1f5f9;
}
.dark .search input,
.dark textarea{
 background:#1b2635;
 color:white;
 border-color:#46546a;
}
.dark .secondary{
 background:#31445c;
 color:#fff;
}
@media(max-width:600px){
 .hero h1{font-size:23px}
 .unit-buttons{grid-template-columns:1fr}
 .stat-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="brand">
<div class="brand-icon">✚</div>
<div>
<div class="brand-title">CPH STUDY</div>
<div class="brand-subtitle">Learn • Practice • Master</div>
</div>
</div>
<button onclick="enableNotifications()">🔔</button>
</header>

<main>

<section class="hero">
<h1>Welcome to CPH STUDY</h1>
<p>Certificate in Pharmacy Study Platform</p>
<div class="quote" id="quote">Loading motivation...</div>
</section>

<div class="search">
<input
id="searchBox"
type="text"
placeholder="🔎 Search class, course unit or topic..."
oninput="searchCourses()">
</div>

<div id="content"></div>

</main>

<nav>
<button onclick="home()">🏠<span>Home</span></button>
<button onclick="focusSearch()">🔎<span>Search</span></button>
<button onclick="showSaved()">🔖<span>Saved</span></button>
<button onclick="settings()">⚙️<span>Settings</span></button>
</nav>

<script>

/* =====================================================
   CPH STUDY — MAIN CURRICULUM
===================================================== */

const curriculum = {
 "CPH 1.1":[
  "Microbiology",
  "Anatomy & Physiology 1",
  "Pharmaceutical Chemistry 1",
  "First Aid",
  "PHC",
  "Computer Applications"
 ],

 "CPH 1.2":[
  "Anatomy & Physiology 2",
  "Pharmaceutical Chemistry 2",
  "Pharmaceutical Calculations",
  "Pharmacognosy",
  "Pharmacology 1",
  "Medical Psychology",
  "Communication Skills",
  "Pharmaceutical Practicals"
 ],

 "CPH 2.1":[
  "Pharmaceutics 1",
  "Pharmacy Laws & Regulations",
  "Pharmacy Practice 1",
  "Therapeutics 1",
  "Pharmacology 2",
  "Stores & Inventory Management"
 ],

 "CPH 2.2":[
  "Pharmaceutics 2",
  "Quality Assurance of Pharmaceuticals",
  "Pharmacy Practice 2",
  "Therapeutics 2",
  "Entrepreneurship"
 ]
};


/* =====================================================
   MOTIVATIONAL QUOTES
   CHANGES EVERY HOUR
===================================================== */

const quotes=[
 "📚 Study consistently, not occasionally.",
 "🧠 Understand first. Memorize second.",
 "🎯 Every topic mastered is one step forward.",
 "💊 Good pharmacy practice begins with good knowledge.",
 "🔬 Learn the science behind the medicine.",
 "📖 Read. Recall. Practise. Improve.",
 "🏆 Your effort today builds your professional future.",
 "💡 Ask questions whenever a concept is unclear.",
 "🚀 Small daily progress becomes great achievement.",
 "🌟 Discipline turns study goals into results.",
 "📝 Practise questions until the method becomes familiar.",
 "🎓 Your knowledge is an investment in your future."
];

function updateQuote(){
 const hour=new Date().getHours();
 const index=hour % quotes.length;
 const element=document.getElementById("quote");
 if(element) element.textContent=quotes[index];
}

updateQuote();

setInterval(updateQuote,60000);


/* =====================================================
   SAFE TEXT
===================================================== */

function safe(text){
 return String(text)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


/* =====================================================
   HOME
===================================================== */

function home(){

 document.getElementById("searchBox").value="";

 document.getElementById("content").innerHTML=`

 <section>
 <h2>🎓 CPH Classes</h2>

 <div class="grid">

 ${Object.keys(curriculum).map(level=>`

  <div class="card">

   <h3>📚 ${safe(level)}</h3>

   <p>
   <span class="badge">
   ${curriculum[level].length} course units
   </span>
   </p>

   <p>
   Access notes, quizzes and discussions
   specifically for this class.
   </p>

   <button onclick="openClass('${safe(level)}')">
   Open Class →
   </button>

  </div>

 `).join("")}

 </div>
 </section>


 <section>

 <h2>🛠️ Study Tools</h2>

 <div class="grid">

 <button class="tool" onclick="quizClasses()">
 📝
 <span>Class-Based Quizzes</span>
 </button>

 <button class="tool" onclick="discussionClasses()">
 💬
 <span>Live Discussions</span>
 </button>

 <button class="tool" onclick="showProgress()">
 📊
 <span>My Progress</span>
 </button>

 <button class="tool" onclick="showSaved()">
 🔖
 <span>Saved Materials</span>
 </button>

 </div>

 </section>

 <section class="card">

 <h2>📌 How CPH STUDY Works</h2>

 <ol>
 <li>Select your CPH class.</li>
 <li>Select a course unit.</li>
 <li>Read the study notes.</li>
 <li>Take the quiz for that exact unit.</li>
 <li>Ask questions in that unit's discussion.</li>
 <li>Track your quiz performance in Progress.</li>
 </ol>

 </section>
 `;
}


/* =====================================================
   CLASS PAGE
===================================================== */

function openClass(level){

 if(!curriculum[level]){
  home();
  return;
 }

 document.getElementById("content").innerHTML=`

 <div class="card">

 <button class="secondary" onclick="home()">← Home</button>

 <h2>📚 ${safe(level)}</h2>

 <p>
 Select a course unit. Materials, quizzes and
 discussions remain separated by class and unit.
 </p>

 </div>

 <div class="grid">

 ${curriculum[level].map(unit=>`

 <div class="card">

 <h3>📖 ${safe(unit)}</h3>

 <p>
 <span class="badge">${safe(level)}</span>
 </p>

 <div class="unit-buttons">

 <button onclick="showNotes('${safe(level)}','${safe(unit)}')">
 📖 Notes
 </button>

 <button onclick="startQuiz('${safe(level)}','${safe(unit)}')">
 📝 Quiz
 </button>

 <button onclick="discussion('${safe(level)}','${safe(unit)}')">
 💬 Discussion
 </button>

 <button class="secondary"
 onclick="saveMaterial('${safe(level)}','${safe(unit)}')">
 🔖 Save
 </button>

 </div>

 </div>

 `).join("")}

 </div>
 `;
}


/* =====================================================
   NOTES
===================================================== */

function showNotes(level,unit){

 document.getElementById("content").innerHTML=`

 <div class="card">

 <button class="secondary" onclick="openClass('${safe(level)}')">
 ← ${safe(level)}
 </button>

 <h2>📖 ${safe(unit)}</h2>

 <p>
 <span class="badge">${safe(level)}</span>
 <span class="badge">${safe(unit)}</span>
 </p>

 <div class="notes">

 <h3>1. Introduction</h3>

 <p>
 This study section is specifically organized for
 <b>${safe(level)}</b> under the course unit
 <b>${safe(unit)}</b>.
 </p>

 <h3>2. Learning Objectives</h3>

 <ul>
 <li>Define and explain important terminology.</li>
 <li>Understand the major principles of the unit.</li>
 <li>Identify important classifications and examples.</li>
 <li>Relate theoretical knowledge to pharmacy practice.</li>
 <li>Apply knowledge to examination-style questions.</li>
 </ul>

 <h3>3. Core Concepts</h3>

 <p>
 Students should first understand the fundamental concepts
 before attempting to memorize details. Pay attention to
 definitions, classifications, processes, mechanisms,
 examples and practical applications.
 </p>

 <h3>4. Important Revision Areas</h3>

 <ul>
 <li>Definitions and terminology</li>
 <li>Classification systems</li>
 <li>Principles and mechanisms</li>
 <li>Examples and applications</li>
 <li>Advantages and disadvantages where applicable</li>
 <li>Common examination points</li>
 <li>Practical pharmacy applications</li>
 </ul>

 <h3>5. Examination Strategy</h3>

 <p>
 Read the question carefully. Identify exactly what is being
 asked, recall the relevant concept, eliminate incorrect
 alternatives and check your answer before submitting.
 </p>

 <h3>6. Active Recall</h3>

 <p>
 After reading this material, close the notes and explain
 the main concepts in your own words. Then attempt the
 unit quiz without looking at the answers.
 </p>

 <h3>7. Further Study</h3>

 <p>
 The course-specific material for this unit can be expanded
 here with detailed topics, definitions, classifications,
 diagrams, practical examples and examination questions.
 </p>

 </div>

 <button onclick="startQuiz('${safe(level)}','${safe(unit)}')">
 📝 Test Yourself
 </button>

 <button onclick="discussion('${safe(level)}','${safe(unit)}')">
 💬 Discuss This Unit
 </button>

 <button onclick="saveMaterial('${safe(level)}','${safe(unit)}')">
 🔖 Save Unit
 </button>

 </div>
 `;
}

===================================================== */
