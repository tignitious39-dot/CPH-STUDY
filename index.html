<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0757a0">
<title>CPH STUDY — Learn • Practice • Master</title>

<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#172033;
line-height:1.6
}

button,input,textarea{font:inherit}

button{cursor:pointer}

.app{
max-width:1100px;
margin:auto;
min-height:100vh
}

header{
position:sticky;
top:0;
z-index:100;
background:linear-gradient(135deg,#064b9b,#168ee5);
color:white;
padding:14px 16px;
box-shadow:0 3px 15px #0003
}

.brand{
display:flex;
align-items:center;
gap:12px
}

.logo{
width:48px;
height:48px;
border-radius:14px;
background:white;
color:#e21b23;
display:grid;
place-items:center;
font-size:28px;
font-weight:bold
}

.brand h1{
margin:0;
font-size:21px
}

.brand small{
opacity:.9
}

main{
padding:16px 14px 100px
}

.hero{
background:linear-gradient(135deg,#0757a0,#168ee5);
color:white;
border-radius:20px;
padding:24px;
margin-bottom:18px;
box-shadow:0 5px 20px #0757a033
}

.hero h2{
margin:0 0 6px;
font-size:26px
}

.hero p{
margin:5px 0
}

.quote{
margin-top:16px;
padding:13px;
background:#ffffff25;
border-radius:12px;
font-weight:bold
}

.search{
margin:15px 0
}

.search input{
width:100%;
padding:15px;
border:1px solid #dbe3ec;
border-radius:13px;
background:white;
outline:none
}

.search input:focus{
border-color:#168ee5;
box-shadow:0 0 0 3px #168ee522
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}

.card{
background:white;
border:1px solid #dbe3ec;
border-radius:16px;
padding:17px;
margin:10px 0;
box-shadow:0 3px 12px #0000000a
}

.level{
color:white;
text-align:left;
min-height:120px;
border:0;
transition:.2s
}

.level:hover{
transform:translateY(-2px)
}

.l11{background:#1474d4}
.l12{background:#15945a}
.l21{background:#e97916}
.l22{background:#7541b7}

.level b{
font-size:20px
}

.level small{
opacity:.92
}

.unit{
width:100%;
display:flex;
align-items:center;
gap:12px;
text-align:left;
background:white;
border:1px solid #dbe3ec;
padding:15px;
border-radius:13px;
margin:9px 0;
transition:.15s
}

.unit:hover{
border-color:#168ee5;
background:#f8fbff
}

.unit .ico{
font-size:27px;
min-width:35px
}

.unit b{
display:block
}

.unit small{
display:block;
color:#64748b
}

.btn{
border:0;
border-radius:11px;
padding:11px 15px;
background:#0757a0;
color:white;
margin:4px 3px
}

.btn:hover{
opacity:.9
}

.secondary{
background:#edf3f8;
color:#0757a0
}

.success{
background:#198754
}

.danger{
background:#dc3545
}

.tabs{
display:flex;
gap:7px;
overflow:auto;
margin:13px 0
}

.tabs button{
white-space:nowrap;
border:1px solid #dbe3ec;
background:white;
padding:10px 14px;
border-radius:20px
}

.tabs .active{
background:#0757a0;
color:white
}

.note{
line-height:1.75
}

.note h3{
margin-top:23px;
color:#0757a0
}

.note ul,
.note ol{
padding-left:23px
}

.topic{
border-left:4px solid #0757a0;
padding:12px 14px;
background:#f8fbff;
margin:10px 0;
border-radius:8px
}

.topic b{
color:#0757a0
}

.pill{
display:inline-block;
background:#eaf3ff;
color:#0757a0;
padding:4px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold
}

.option{
width:100%;
display:block;
text-align:left;
background:white;
border:1px solid #dbe3ec;
padding:13px;
border-radius:10px;
margin:8px 0
}

.option:hover{
background:#f5faff
}

.option.correct{
border:3px solid #198754;
background:#ecfaf2
}

.option.wrong{
border:3px solid #dc3545;
background:#fff0f0
}

textarea{
width:100%;
min-height:130px;
padding:13px;
border:1px solid #dbe3ec;
border-radius:10px;
resize:vertical
}

.post{
padding:13px;
border-left:4px solid #168ee5;
background:#f7f9fc;
border-radius:9px;
margin:9px 0
}

.statgrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px
}

.stat{
text-align:center;
background:#f1f5f9;
border-radius:11px;
padding:15px
}

.stat strong{
display:block;
font-size:27px;
color:#0757a0
}

.empty{
text-align:center;
color:#64748b;
padding:28px
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
max-width:1100px;
margin:auto;
background:white;
border-top:1px solid #dbe3ec;
display:grid;
grid-template-columns:repeat(4,1fr);
z-index:100
}

.bottom button{
background:white;
border:0;
padding:8px 4px;
color:#64748b
}

.bottom b{
display:block;
font-size:20px;
color:#0757a0
}

.bottom span{
font-size:11px
}

hr{
border:0;
border-top:1px solid #dbe3ec;
margin:18px 0
}

.notice{
padding:13px;
border-radius:10px;
background:#fff8e6;
border-left:4px solid #e97916;
margin:10px 0
}

.answerbox{
background:#f8fbff;
border:1px dashed #168ee5;
padding:14px;
border-radius:10px;
margin-top:10px
}

.hidden{
display:none!important
}

@media(max-width:600px){
.grid{
grid-template-columns:1fr 1fr
}

.statgrid{
grid-template-columns:1fr 1fr 1fr
}

.hero h2{
font-size:23px
}

.card{
padding:14px
}
}
</style>
</head>
