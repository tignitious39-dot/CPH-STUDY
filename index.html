body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;line-height:1.6}
header{background:#0757a0;color:white;padding:15px;position:sticky;top:0;z-index:100}
.header{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;gap:10px;align-items:center}
.logo-icon{font-size:32px}
.logo b{font-size:22px}
.logo small{display:block;opacity:.85}
.menu{background:white;color:#0757a0;border:0;border-radius:8px;padding:9px 13px;font-size:20px}
nav{display:none;background:white;box-shadow:0 3px 10px #0002;padding:8px}

main{max-width:1100px;margin:auto;padding:18px}

.search input,.form-input,textarea{width:100%;padding:14px;border:1px solid #ccd7e5;border-radius:10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:white;padding:18px;border-radius:14px;box-shadow:0 3px 12px #0001;margin-bottom:15px}
.card h2,.card h3{color:#0757a0}
button,.action{background:#0757a0;color:white;border:0;border-radius:8px;padding:11px 14px;margin:5px;cursor:pointer}
button:disabled{opacity:.7}
.unit,.topic{padding:12px;margin:8px 0;border:1px solid #dce5ef;border-radius:9px;background:#f8fbff;cursor:pointer}
.unit:hover,.topic:hover{background:#eaf4ff}
.tag{display:inline-block;background:#eaf4ff;padding:4px 9px;border-radius:20px;font-size:13px}
.option{display:block;width:100%;text-align:left;background:white;color:#172033;border:1px solid #ccd7e5}
.correct{border:3px solid green!important}
.wrong{border:3px solid red!important}
.note{background:white;padding:20px;border-radius:14px;box-shadow:0 3px 12px #0001}
.note h2,.note h3{color:#0757a0}
.note h3{margin-top:22px}
.note li{margin:7px 0}
.progressbar{height:12px;background:#e1e8ef;border-radius:10px;overflow:hidden}
.progressfill{height:100%;background:#0757a0;width:0}
footer{background:#102a43;color:white;text-align:center;padding:25px;margin-top:30px}
.dark{background:#101820;color:#eee}
.dark .card,.dark .note,.dark nav,.dark .unit,.dark .topic,.dark .option{background:#1c2935;color:#eee}
.dark nav button{background:#1c2935;color:white}
.dark .card h2,.dark .card h3,.dark .note h2,.dark .note h3{color:#72b8ff}
.hidden{display:none}
@media(max-width:600px){main{padding:12px}.hero h1{font-size:27px}}

/* =====================================================
   SEARCH
===================================================== */

function searchCourses(){

const q=document
.getElementById("searchBox")
.value
.toLowerCase()
.trim();

if(!q){

home();

return;

}

document.getElementById("home").style.display="none";

let found=[];

semesters.forEach((s,i)=>{

s.units.forEach((u,j)=>{

if(
u.toLowerCase().includes(q) ||
s.name.toLowerCase().includes(q)
){

found.push({s,i,u,j});

}

});

});

document.getElementById("content").innerHTML=`

<h2>🔎 Search Results</h2>

<div class="grid">

${
found.length

?

found.map(x=>`

<div class="card">

<h3>
${x.s.icon} ${x.u}
</h3>

<p>${x.s.name}</p>

<button onclick="openCourse(${x.i},${x.j})">
Open Course
</button>

</div>

`).join("")

:

`<div class="card">
<h3>No results found</h3>
<p>Try another course name.</p>
</div>`

}

</div>

`;

}

let saved=
JSON.parse(localStorage.getItem("cphBookmarks")||"[]");

if(!saved.includes(key)){

saved.push(key);

localStorage.setItem(
"cphBookmarks",
JSON.stringify(saved)
);

alert("🔖 Topic saved.");

}

}

`;

let qi=0;

function quiz(){

document.getElementById("home").style.display="none";

qi=0;
score=0;

showQuestion();

window.scrollTo(0,0);

}


function showQuestion(){

const q=questions[qi];

document.getElementById("content").innerHTML=`

<div class="card">

<h2>📝 CPH MCQ Centre</h2>

<p>
Question ${qi+1} of ${questions.length}
</p>

<div class="progressbar">

<div
class="progressfill"
style="width:${(qi/questions.length)*100}%">
</div>

</div>

<h3 style="margin-top:20px">
${q.q}
</h3>

<div>

${q.o.map((x,i)=>`

<button
class="option"
onclick="answer(${i})">

${String.fromCharCode(65+i)}. ${x}

</button>

`).join("")}

</div>

</div>

`;

}


function answer(selected){

const q=questions[qi];

const buttons=
document.querySelectorAll(".option");

buttons.forEach(b=>b.disabled=true);

if(selected===q.a){

score++;

buttons[selected].classList.add("correct");

}else{

buttons[selected].classList.add("wrong");

buttons[q.a].classList.add("correct");

}

document.querySelector(".card").innerHTML+=`

<div class="card" style="margin-top:15px">

<strong>
${selected===q.a?"✅ Correct":"❌ Incorrect"}
</strong>

<p>
<b>Explanation:</b> ${q.e}
</p>

<button onclick="nextQuestion()">
Next →
</button>

</div>

`;

}


function nextQuestion(){

qi++;

if(qi<questions.length){

showQuestion();

}else{

finishQuiz();

}

}
